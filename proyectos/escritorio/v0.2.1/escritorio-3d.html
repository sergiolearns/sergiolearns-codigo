<style>
/* v0.2 · Una habitación de noche vista desde la silla. Fuera del PC no hay interfaz: solo el punto. */
:root{
  --ink:#1E1B2E; --ink-2:#2A2640; --ink-3:#141221; --line:#3A3552;
  --violet:#5B4BDB; --violet-l:#A99EF5; --coral:#FF6B4A; --coral-l:#FF9B80;
  --cream:#FAFAF7; --text:#E8E6F5; --muted:#C9C5DC; --ok:#5BD39A; --err:#FF8A7A; --amber:#F5C06B;
  --f-display:'Space Grotesk','Segoe UI',system-ui,sans-serif;
  --f-body:Inter,'Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink-3);color:var(--text);font-family:var(--f-body);overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none;outline:none}
code,.mono{font-family:var(--f-mono);font-variant-ligatures:none}
/* el punto (E03): cambia de forma según la acción */
#punto{position:fixed;left:0;top:0;z-index:9;pointer-events:none;width:0;height:0;transition:opacity .2s}
#punto .ico{position:absolute;left:-15px;top:-15px;width:30px;height:30px;transition:transform .16s cubic-bezier(.2,.9,.3,1.3);filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
#punto svg{display:block;overflow:visible}
#punto .nombre{position:absolute;left:18px;top:10px;white-space:nowrap;font:500 12px/1 var(--f-body);color:var(--cream);text-shadow:0 1px 3px rgba(0,0,0,.8);opacity:0;transform:translateY(3px);transition:opacity .25s,transform .25s}
#punto.con-nombre .nombre{opacity:.92;transform:none}
#punto.oculto{opacity:0}
/* velo de inspección: la habitación se oscurece alrededor del objeto */
#velo{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(20,18,33,0) 30%,rgba(20,18,33,.72) 100%);opacity:0;transition:opacity .45s}
#velo.on{opacity:1}
/* recordatorio de teclas, solo las dos primeras veces que se inspecciona */
#teclas{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;display:flex;gap:18px;font:500 13px var(--f-body);color:var(--muted);opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#teclas.on{opacity:1}
#teclas kbd{display:inline-block;min-width:24px;padding:2px 7px;margin-right:6px;border:1px solid rgba(201,197,220,.5);border-bottom-width:2px;border-radius:6px;font:600 12px var(--f-mono);font-variant-ligatures:none;color:var(--cream);text-align:center}
/* accesibilidad (E20): invisible hasta que se usa el teclado */
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#saltar{position:fixed;left:16px;top:16px;z-index:40;padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--text);font:500 14px var(--f-body);box-shadow:0 0 0 2px var(--coral);text-decoration:none;transform:translateY(-200%)}
#saltar:focus{transform:none;outline:none}
#objetos button{all:unset}
#etiqueta{position:fixed;z-index:8;pointer-events:none;transform:translate(-50%,-140%);padding:6px 10px;border-radius:8px;background:rgba(20,18,33,.86);box-shadow:0 0 0 2px var(--coral);font:500 13px var(--f-body);color:var(--cream);white-space:nowrap}
:focus-visible{outline:2px solid var(--coral);outline-offset:3px}
#entrada{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
#carga{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--ink-3);font:500 15px var(--f-body);color:var(--muted);transition:opacity .6s}
#carga.fuera{opacity:0;pointer-events:none}
#sin3d{position:fixed;inset:0;z-index:31;display:grid;place-items:center;padding:24px;background:var(--ink);font:400 15px/1.7 var(--f-body)}
#sin3d a{color:var(--violet-l)}
/* SergioLearns OS (mundo virtual: aquí sí hay terminal). Se rehace en la v0.3 */
#os{position:fixed;inset:0;z-index:20;background:var(--ink-3);overflow:hidden;transform-origin:50% 50%;cursor:default}
#os.on{animation:crtOn .55s cubic-bezier(.2,.8,.2,1)}
#os.off{animation:crtOff .45s ease-in forwards}
@keyframes crtOn{0%{transform:scale(1,.004);filter:brightness(3)}45%{transform:scale(1,.004)}100%{transform:scale(1,1);filter:brightness(1)}}
@keyframes crtOff{0%{transform:scale(1,1)}55%{transform:scale(1,.004);filter:brightness(2.5)}100%{transform:scale(0,.004);filter:brightness(4)}}
#wall{position:absolute;inset:0;width:100%;height:100%}
.os-bar{position:absolute;left:0;right:0;top:0;height:44px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(20,18,33,.9);border-bottom:1px solid var(--line);font:600 13px var(--f-mono);font-variant-ligatures:none}
.os-bar .clock{color:var(--muted);font-weight:400}
.dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(20,18,33,.9);border:1px solid var(--line);border-radius:20px;padding:8px 10px;max-width:calc(100vw - 32px);overflow-x:auto}
.dock button{background:none;border:1px solid transparent;border-radius:14px;padding:8px 10px;min-width:70px;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:var(--text);font:500 11px var(--f-mono);font-variant-ligatures:none;transition:transform .18s cubic-bezier(.2,.9,.3,1.3)}
.dock button:hover,.dock button:focus-visible{transform:translateY(-6px) scale(1.12);border-color:var(--coral)}
.dock svg{width:26px;height:26px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.win{position:absolute;width:min(640px,calc(100vw - 32px));background:var(--ink-2);border-radius:14px;box-shadow:0 0 0 1px rgba(255,107,74,.45),0 24px 60px rgba(0,0,0,.5);overflow:hidden;animation:winIn .3s cubic-bezier(.2,.9,.3,1.15)}
@keyframes winIn{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
.win-bar{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;background:var(--ink);cursor:grab;font:600 13px var(--f-mono);font-variant-ligatures:none;touch-action:none;user-select:none}
.win-bar button{background:none;border:0;cursor:pointer;color:var(--muted);padding:6px 10px;min-height:32px;font:600 12px var(--f-mono)}
.win-bar button:hover{color:var(--coral-l)}
.win-body{padding:16px 18px;font:400 14px/1.65 var(--f-mono);font-variant-ligatures:none;max-height:min(56vh,460px);overflow:auto;white-space:normal}
.win-body a{color:var(--violet-l)}
.win-body pre{margin:0;white-space:pre-wrap;font:inherit}
.term-line{white-space:pre-wrap}
.term-in{display:flex;gap:8px;align-items:center;margin-top:6px}
.term-in label{color:var(--violet-l);white-space:nowrap}
.term-in input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font:400 14px var(--f-mono);font-variant-ligatures:none;caret-color:var(--coral)}
.c-ok{color:var(--ok)}.c-err{color:var(--err)}.c-cmd{color:var(--violet-l)}.c-dim{color:var(--muted)}.c-num{color:var(--amber)}.c-co{color:var(--coral)}
.dollar{color:var(--coral)}
@media (prefers-reduced-motion: reduce){
  #os.on,#os.off,.win{animation:none}
  .dock button,#punto .ico,#velo,#teclas{transition:none}
}

<script type="module">
/* ===================== 01 · núcleo =====================
   Motor (three.js como módulo), utilidades de geometría y texturas,
   animaciones (curvas, anim() con promesas y muelles) y el «bus» de eventos
   con el que se avisan los módulos entre sí. */
import * as THREE from 'three';

const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const $ = s => document.querySelector(s);
const VERSION = 'v0.2.1';
// Para probar: ?hora=21 fuerza la hora de Canarias (0-24, admite 21.5), ?lluvia=1 o 0 fuerza el tiempo
const PARAMS = new URLSearchParams(location.search);

/* ---------- bus: los módulos se avisan sin conocerse ---------- */
const bus = {
  oy: {},
  on(ev, fn) { (this.oy[ev] = this.oy[ev] || []).push(fn); },
  emit(ev, dato) { (this.oy[ev] || []).forEach(fn => fn(dato)); }
};

/* ---------- guardado por persona (solo comodidades: puede fallar) ---------- */
const guardado = {
  get(k, def) { try { const v = localStorage.getItem('sl-escritorio-' + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem('sl-escritorio-' + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento: no pasa nada */ } }
};

/* ---------- WebGL ---------- */
const canvas = $('#gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer || !renderer.getContext()) {
  const fb = $('#sin3d');
  fb.innerHTML = '<div><p>Este navegador no puede dibujar la habitación en 3D (WebGL).</p>' +
    '<p>Todo lo que hay en ella está también en la web: <a href="https://sergiolearns.com/aprende/">Aprende</a> · <a href="https://sergiolearns.com/laboratorio/">Laboratorio</a> · <a href="https://sergiolearns.com/universidad/">Universidad</a></p></div>';
  fb.hidden = false; $('#carga').hidden = true;
  throw new Error('sin WebGL');
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141221);
scene.fog = new THREE.Fog(0x141221, 3.4, 6.5);
const camera = new THREE.PerspectiveCamera(62, 1, 0.02, 20);
const BASE = new THREE.Vector3(0, 1.22, 0.55);   // los ojos de alguien sentado
const MESA_Y = 0.74, PLANO_Y = 0.765;            // tablero de la mesa y plano de trabajo para arrastrar

/* ---------- geometría ---------- */
function mat(color, o = {}) {
  return new THREE.MeshStandardMaterial({
    color, roughness: o.r ?? 0.82, metalness: o.m ?? 0.04,
    emissive: o.e ?? 0x000000, emissiveIntensity: o.ei ?? 0, map: o.map ?? null,
    transparent: !!o.t, opacity: o.op ?? 1, side: o.side ?? THREE.FrontSide
  });
}
function box(w, h, d, m, x = 0, y = 0, z = 0, padre = scene) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y, z); padre.add(mesh); return mesh;
}
function cyl(rt, rb, h, m, x = 0, y = 0, z = 0, padre = scene, seg = 32) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  mesh.position.set(x, y, z); padre.add(mesh); return mesh;
}
function plano(w, h, m, x = 0, y = 0, z = 0, rx = 0, ry = 0, padre = scene) {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
  p.position.set(x, y, z); p.rotation.set(rx, ry, 0); padre.add(p); return p;
}

/* ---------- texturas dibujadas en un lienzo ---------- */
const MONO = '"JetBrains Mono", ui-monospace, Consolas, monospace';
const DISP = '"Space Grotesk", "Segoe UI", sans-serif';
const BODY = 'Inter, "Segoe UI", sans-serif';
const MANO = 'Caveat, "Segoe Print", cursive';   // la letra a mano (pizarra, etiquetas de los discos)
const TEXTURAS = [];   // las que se redibujan cuando cargan las fuentes
function texFrom(w, h, dibuja) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); if (dibuja) dibuja(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.userData = { canvas: c, g, dibuja };
  if (dibuja) TEXTURAS.push(t);
  return t;
}
function redibuja(t, dibuja) { const { canvas: c, g } = t.userData; g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height); g.restore(); (dibuja || t.userData.dibuja)(g, c.width, c.height); t.needsUpdate = true; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function wrap(g, texto, x, y, maxW, lh) {
  const palabras = texto.split(' '); let linea = '';
  for (const p of palabras) {
    const t = linea ? linea + ' ' + p : p;
    if (g.measureText(t).width > maxW && linea) { g.fillText(linea, x, y); linea = p; y += lh; } else linea = t;
  }
  if (linea) g.fillText(linea, x, y);
  return y;
}

/* ---------- animaciones ---------- */
// Curvas: reciben el avance x (0 → 1) y devuelven cuánto se ha movido (puede pasar de 1 en las que rebotan)
const curva = {
  lineal: x => x,
  suave: x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),   // cúbica de entrada y salida (la de la v0.1)
  sale: x => 1 - Math.pow(1 - x, 3),                                        // frena al final
  entra: x => x * x * x,                                                     // arranca despacio
  retroceso: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }, // se pasa y vuelve
  rebote: x => {                                                             // cae y rebota (disco en la bandeja)
    const n = 7.5625, d = 2.75;
    if (x < 1 / d) return n * x * x;
    if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75;
    if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375;
    return n * (x -= 2.625 / d) * x + 0.984375;
  }
};
const anims = [];
// anim(duración en ms, función que recibe el avance ya curvado, curva) → promesa que se cumple al terminar
function anim(dur, fn, ease = curva.suave) {
  return new Promise(resolve => {
    const a = { t0: performance.now(), dur: reduced ? Math.min(dur, 1) : dur, fn, ease, resolve, vivo: true };
    anims.push(a);
  });
}
function espera(ms) { return anim(reduced ? 0 : ms, () => {}); }
function corrAnims(ahora) {
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i], p = Math.min(1, (ahora - a.t0) / a.dur);
    a.fn(a.ease(p), p);
    if (p >= 1) { anims.splice(i, 1); a.resolve(); }
  }
}
// Muelle amortiguado: da «peso» (cajón, objeto que se lleva). F = −k·(x − objetivo) − c·v
class Muelle {
  constructor(x = 0, k = 120, c = 16, m = 1) { this.x = x; this.v = 0; this.obj = x; this.k = k; this.c = c; this.m = m; }
  paso(dt) {
    if (reduced) { this.x = this.obj; this.v = 0; return this.x; }
    const sub = Math.ceil(dt / 0.008), h = dt / sub;          // pasos pequeños para que no se vuelva inestable
    for (let i = 0; i < sub; i++) {
      const a = (-this.k * (this.x - this.obj) - this.c * this.v) / this.m;
      this.v += a * h; this.x += this.v * h;                  // Euler semiimplícito: primero la velocidad
    }
    return this.x;
  }
  quieto() { return Math.abs(this.x - this.obj) < 1e-4 && Math.abs(this.v) < 1e-3; }
}
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

/* ===================== 02 · datos =====================
   Lo que hay en la habitación, con datos reales de la web (4 nov 2026).

const objetos = new Map(), pickables = [];
function mats(m) { return Array.isArray(m.material) ? m.material : [m.material]; }
/* registrar(clave, {nombre, mallas, raiz, movil, alClic, alUsar, alArrastrar, insp, activo}) */
function registrar(clave, o) {
  o.clave = clave;
  o.activo = o.activo || (() => gesto.estado === 'libre');
  objetos.set(clave, o);
  o.mallas.forEach(m => {
    m.userData.clave = clave; pickables.push(m);
    m.material = Array.isArray(m.material) ? m.material.map(x => x.clone()) : m.material.clone();
    mats(m).forEach(x => { if (x.emissive) { x.userData.e0 = x.emissive.getHex(); x.userData.ei0 = x.emissiveIntensity; } });
  });
  if (o.raiz) guardaCasa(o);
  return o;
}
function guardaCasa(o) { const r = o.raiz; o.casa = { padre: r.parent, pos: r.position.clone(), quat: r.quaternion.clone() }; }
// Brillo coral al pasar por encima (k = 0 apaga, 1 = resaltado normal, más = zona de destino)
function brillo(mallas, k, color = 0xFF6B4A) {
  mallas.forEach(m => mats(m).forEach(x => {
    if (!x.emissive) return;
    if (k <= 0) { x.emissive.setHex(x.userData.e0 ?? 0); x.emissiveIntensity = x.userData.ei0 ?? 0; }
    else { x.emissive.setHex(color); x.emissiveIntensity = Math.max(0.22 * k, x.userData.ei0 ?? 0); }
  }));
}

const USOS = {};   // tipo → qué hace E (los rellena el módulo 07)

const zonas = [];

  setHover(null); cambia('llevar'); gesto.obj = o; llevar.o = o;
  bus.emit('coge', o);
  scene.attach(o.raiz);
  llevar.obj.copy(o.raiz.position); llevar.prev.copy(o.raiz.position); llevar.vel.set(0, 0, 0);
  llevar.q.copy(o.raiz.quaternion);

  llevar.salida = o.casaArriba ? { desde: o.raiz.position.clone(), alto: o.casaArriba.y } : null;
  rig.sensib = 0.45;   // mientras llevas algo, la cámara gira menos con el ratón

}
const _hitP = new THREE.Vector3();
const QLLEVAR = { disco: new THREE.Quaternion().setFromEuler(new THREE.Euler(0.85, 0, 0)),   // el disco se lleva inclinado hacia ti: se ve su etiqueta
  usb: new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI / 2, Math.PI, 0)), carpeta: new THREE.Quaternion(), taza: null };
function corrLlevar(dt) {
  const o = llevar.o; if (gesto.estado !== 'llevar' || !o) return;
  raycaster.setFromCamera(ndc, camera);

  planoTrabajo.constant = -alturaBase;
  if (raycaster.ray.intersectPlane(planoTrabajo, _hitP)) {

/* ===================== 07 · acciones =====================
   Qué hace cada objeto: disco a la disquetera y USB al puerto (E05, E24),
   cajón con peso (E09), carpeta que se abre en la mesa (E07), taza con
   Sergio Bot en el vapor (E10), lámpara con interruptor (E09) y la puerta. */

/* ---------- torre: disquetera ---------- */
const torre = { disco: null, usb: null, bandeja: 0 };   // bandeja: 0 cerrada, 1 abierta
function mueveBandeja(a, dur = 380) { const b0 = torre.bandeja; return anim(dur, e => { torre.bandeja = lerp(b0, a, e); tray.position.z = lerp(TRAY_CERRADA, TRAY_ABIERTA, torre.bandeja); }, curva.suave); }
// v0.2.1 (E35): la zona está DELANTE de la bandeja abierta (no encima): el disco llega por delante y entra deslizándose
const DELANTE_BANDEJA = v3(0.82, 1.118, -0.152 + 0.1);
const zonaDisquetera = zona({
  clave: 'disquetera', punto: DELANTE_BANDEJA, radio: 0.32, mallas: [slot, trayMesh], quat: new THREE.Quaternion(),
  acepta: o => o.tipo === 'disco',
  alEntrar: () => { if (!torre.disco) mueveBandeja(1); },
  alSalir: () => { if (!torre.disco) mueveBandeja(0); },
  encaja: o => meteDisco(o)

USOS.disco = o => meteDisco(o);
async function meteDisco(o) {
  cambia('ocupado'); gesto.obj = o;
  if (torre.disco && torre.disco !== o) await sacaDisco(false);
  if (torre.bandeja < 1) await mueveBandeja(1);
  scene.attach(o.raiz);
  tray.updateMatrixWorld(true);
  // recorrido (E35): delante de la bandeja y algo más alto → se desliza hacia dentro rozando → se asienta con un rebote

  await anim(480, e => { bezier2(p0, C, delante, e, o.raiz.position); o.raiz.quaternion.slerpQuaternions(q0, q1, Math.min(1, e * 1.3)); }, curva.suave);
  await anim(300, e => o.raiz.position.lerpVectors(delante, roza, e), curva.sale);

function pantallaSegunTorre() {
  if (torre.disco) pantalla.pon('simulacro', torre.disco.datos);

/* ---------- responder la pregunta del día: el rotulador escribe la letra trazo a trazo ---------- */
async function responde(letra) {
  if (piz.escribiendo) return;
  piz.escribiendo = true;
  if (!esRotulador(piz.herramienta)) await vaHerramienta('azul');
  const rot = herr[piz.herramienta].g;
  const c = capaGuiada.getContext('2d'); c.clearRect(0, 0, PW, PH); componePizarra();
  const [x, y, w, h] = letra === 'V' ? CAJA_V : CAJA_F;
  const TRAZOS = letra === 'V' ? [[[0.2, 0.14], [0.5, 0.86], [0.8, 0.14]]] : [[[0.32, 0.1], [0.32, 0.9]], [[0.32, 0.12], [0.8, 0.12]], [[0.32, 0.48], [0.68, 0.48]]];
  for (const t of TRAZOS) {
    const pts = t.map(([u, v]) => ({ x: x + u * w, y: y + v * h }));
    const p0 = rot.position.clone(), destino = enPizarra(pts[0].x, pts[0].y).add(v3(0.075, 0.02, 0));
    await anim(220, e => rot.position.lerpVectors(p0, destino, e), curva.suave);
    let largo = 0; for (let i = 1; i < pts.length; i++) largo += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    let prev = pts[0];
    await anim(160 + largo * 2.2, e => {
      let resto = e * largo, i = 1, q = pts[0];
      while (i < pts.length) { const s = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); if (resto <= s) { const f = resto / s; q = { x: lerp(pts[i - 1].x, pts[i].x, f), y: lerp(pts[i - 1].y, pts[i].y, f) }; break; } resto -= s; q = pts[i]; i++; }
      pintaOp(c, { t: 'trazo', c: TINTA, w: 6, p: [[prev.x, prev.y], [q.x, q.y]] }); prev = q; componePizarra();
      rot.position.copy(enPizarra(q.x, q.y).add(v3(0.055, 0.02, 0))); rot.quaternion.copy(Q_ESCRIBE);
    }, curva.lineal);
  }
  const bien = letra === PREGUNTA.correcta;
  const lineas = [[bien ? '¡Bien! Es falso.' : 'Casi: es falso.', bien ? '#16794B' : TINTA_ROJA, 44], ...PREGUNTA.explica.map(t => [t, TINTA, 34])];
  let yy = 494;
  for (const [txt, color, tam] of lineas) { await escribeLinea(c, txt, 540, yy, color, tam, rot); yy += tam + 10; }
  piz.respuesta = letra; piz.escribiendo = false;
  anuncia((bien ? 'Correcto. ' : 'No es correcto. ') + PREGUNTA.explica.join(' '));
}
async function escribeLinea(c, txt, x, y, color, tam, rot) {
  const tmp = document.createElement('canvas'); tmp.width = PW; tmp.height = tam + 30; const t = tmp.getContext('2d');
  t.font = '700 ' + tam + 'px ' + MANO; t.fillStyle = color; t.fillText(txt, x, tam); const ancho = t.measureText(txt).width;
  let hecho = 0;
  await anim(260 + ancho * 3.2, e => {
    const hasta = x + ancho * e;
    c.drawImage(tmp, x + hecho, 0, hasta - x - hecho + 1, tmp.height, x + hecho, y - tam, hasta - x - hecho + 1, tmp.height);
    hecho = hasta - x; componePizarra();
    rot.position.copy(enPizarra(hasta, y - tam * 0.35).add(v3(0.055, 0.02, 0)));
  }, curva.lineal);
}

modo('pizarra', {

    return esRotulador(piz.herramienta) ? ['rotulador', '', COLORES[piz.herramienta]] : ['borrador'];
  },
  down(e) {

      return;

    const op = borra ? { t: 'borra', w: GROSOR.borra[piz.grosor], p: [[Math.round(u.x), Math.round(u.y)]] } : { t: 'trazo', c: COLORES[piz.herramienta], w: GROSOR.trazo[piz.grosor], p: [[Math.round(u.x), Math.round(u.y)]] };

    if (borra) pintaOp(capaGuiada.getContext('2d'), Object.assign({}, op, { capa: true }));

  },
  move() {

    piz.punta.copy(u.p);
    const tr = piz.trazando; if (!tr) return;
    if (Math.hypot(u.x - piz.ultimo.x, u.y - piz.ultimo.y) < 2) return;   // menos puntos que guardar
    const seg = { t: tr.op.t, c: tr.op.c, w: tr.op.w, p: [[piz.ultimo.x, piz.ultimo.y], [u.x, u.y]] };

  },
  up() { if (piz.trazando) { piz.trazando = null; guardaPizarra(); } },
  wheel(e) { cambiaGrosor(e.deltaY < 0 ? 1 : -1); },
  tecla(e) {

    if (e.ctrlKey || e.metaKey || e.altKey) return false;
    if (K === 'V' || K === 'F') { responde(K); return true; }
    if (k === '1' || k === '2' || k === '3') { vaHerramienta(['azul', 'rojo', 'verde'][+k - 1]); return true; }
    if (K === 'B') { vaHerramienta('borrador'); return true; }

  }
});

/* ===================== 11 · la ventana: el ático vivo (E33) =====================
   Fuera se ve la hora REAL de Canarias (zona IANA Atlantic/Canary): mañana, mediodía,
   tarde y noche, con todo lo de en medio. El paisaje va por capas, cada una en un plano a
   su distancia detrás de la ventana (paralaje de verdad cuando la cámara se acerca):
     cielo (degradado, sol, luna con su fase real, estrellas) · nubes que se mueven ·
     ciudad lejana (luces rojas de aviso) · barrio (ventanas que se encienden, depósitos
     de agua en las azoteas, farolas al fondo) · cables de la luz (las palomas se posan) ·
     el ático de delante (pretil, macetas, tendedero) · la lluvia y las gotas del cristal.
   Las capas quietas se repintan una vez por minuto; solo lo vivo se dibuja ~20 veces por
   segundo. Con «reducir movimiento», todo quieto. Para probar: ?hora=21 (o 21.5) y ?lluvia=1.
   Boceto: material/v0.2.1/bocetos/03 · cuentas del cielo: scripts/atico.py · fragmento F5. */

/* ---------- la hora de Canarias ---------- */
let HORA_FORZADA = PARAMS.has('hora') ? clamp(parseFloat(PARAMS.get('hora')) || 0, 0, 23.999) : null;
let LLUVIA_FORZADA = PARAMS.has('lluvia') ? PARAMS.get('lluvia') !== '0' : null;
const fmtCanarias = (() => { try { return new Intl.DateTimeFormat('en-GB', { timeZone: 'Atlantic/Canary', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }); } catch (e) { return null; } })();
function ahoraCanarias() {
  // { h: hora decimal, y, m, d } en Canarias. Si el navegador no conoce la zona, se usa la hora local
  const ahora = new Date(); let y, m, d, h;
  if (fmtCanarias) {
    const p = {}; fmtCanarias.formatToParts(ahora).forEach(x => { p[x.type] = x.value; });
    y = +p.year; m = +p.month; d = +p.day; h = (+p.hour) + (+p.minute) / 60 + (+p.second) / 3600;
  } else { y = ahora.getFullYear(); m = ahora.getMonth() + 1; d = ahora.getDate(); h = ahora.getHours() + ahora.getMinutes() / 60 + ahora.getSeconds() / 3600; }
  if (HORA_FORZADA !== null) h = HORA_FORZADA;
  return { h, y, m, d };
}
function horaTexto() { const { h } = ahoraCanarias(); const hh = Math.floor(h), mm = Math.floor((h - hh) * 60); return hh + ':' + String(mm).padStart(2, '0'); }
function momentoDelDia(h) { return h >= 7 && h < 12 ? 'mañana' : h >= 12 && h < 16 ? 'mediodía' : h >= 16 && h < 20 ? 'tarde' : 'noche'; }

/* ---------- el cielo según la hora: horas clave e interpolación (la misma tabla que atico.py) ---------- */
const CLAVES = [
  [0.0, '#0E0C1A', '#2A2346', '#15121F', 0.55, 1], [6.6, '#1A1733', '#4A3A66', '#1B1828', 0.35, 1],
  [7.8, '#3E4C8C', '#FF9B80', '#2B2638', 0.20, 0.6], [9.5, '#6F96D6', '#EFE2D2', '#4A4560', 0.05, 0],
  [13.0, '#4F86D9', '#CFE3F5', '#5A566E', 0.0, 0], [16.5, '#6A8BCC', '#F2D3A0', '#4E4862', 0.02, 0],
  [18.6, '#4638B8', '#FF6B4A', '#2E2A42', 0.25, 0.4], [19.5, '#26224F', '#7A4E7E', '#1E1B2E', 0.5, 1],
  [21.0, '#110F20', '#2C2448', '#16131F', 0.65, 1], [24.0, '#0E0C1A', '#2A2346', '#15121F', 0.55, 1]

// mezcla de dos colores en sRGB, canal a canal (como scripts/atico.py). Ojo: THREE.Color mezcla en espacio lineal
// y aclaraba mucho los grises oscuros (un 14 % de crema sobre tinta salía gris medio): por eso se hace a mano
function rgbDe(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mezclaHex(a, b, t) { const A = rgbDe(a), B = rgbDe(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function cieloA(h) {
  h = ((h % 24) + 24) % 24;
  for (let i = 0; i < CLAVES.length - 1; i++) {
    const a = CLAVES[i], b = CLAVES[i + 1];
    if (h >= a[0] && h <= b[0]) {
      let t = (h - a[0]) / (b[0] - a[0]); t = t * t * (3 - 2 * t);           // suave en los extremos (smoothstep)
      return { arriba: mezclaHex(a[1], b[1], t), abajo: mezclaHex(a[2], b[2], t), edif: mezclaHex(a[3], b[3], t), ventanas: lerp(a[4], b[4], t), farolas: lerp(a[5], b[5], t) };
    }
  }
}
// El sol sale a las 7:50 y se pone a las 18:55 (noviembre en Gran Canaria): altura = sen(π·(h − salida)/(puesta − salida))
const SOL = { sale: 7.83, pone: 18.92 };
function alturaSol(h) { return h >= SOL.sale && h <= SOL.pone ? Math.sin(Math.PI * (h - SOL.sale) / (SOL.pone - SOL.sale)) : -1; }
// La luna con su fase real: días desde una luna nueva conocida (6 ene 2000, 18:14 UTC) módulo el mes sinódico
const MES_SINODICO = 29.530588853;
function edadLuna(fecha = new Date()) { const dias = (fecha - Date.UTC(2000, 0, 6, 18, 14)) / 86400000; return ((dias % MES_SINODICO) + MES_SINODICO) % MES_SINODICO; }
function iluminadaLuna(edad) { return (1 - Math.cos(2 * Math.PI * edad / MES_SINODICO)) / 2; }   // fracción iluminada (0 nueva, 1 llena)

/* ===================== 11 · teclado y accesibilidad =====================
