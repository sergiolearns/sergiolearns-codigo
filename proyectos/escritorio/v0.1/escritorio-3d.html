<title>Escritorio 3D de SergioLearns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Una habitación de noche vista desde la silla: una sola apariencia oscura a propósito (la «terminal cálida» de SergioLearns). */
:root{
  --ink:#1E1B2E; --ink-2:#2A2640; --ink-3:#141221; --line:#3A3552;
  --violet:#5B4BDB; --violet-l:#A99EF5; --coral:#FF6B4A; --coral-l:#FF9B80;

  --f-body:Inter, 'Segoe UI', system-ui, sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
#gl.pointer{cursor:pointer}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--coral);outline-offset:3px}
.mono{font-family:var(--f-mono);font-variant-ligatures:none}
.hud{position:fixed;z-index:5;font:600 13px var(--f-mono);font-variant-ligatures:none;pointer-events:none}
.hud-top{left:calc(18px + env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));color:var(--text)}
.hud-top .v{color:var(--muted);font-weight:400;margin-left:10px}
.dollar,.cur{color:var(--coral)}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hud-bottom{left:calc(16px + env(safe-area-inset-left,0px));right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hint{color:var(--muted);font-weight:400;background:rgba(20,18,33,.72);padding:8px 12px;border-radius:10px}
.hud-bottom .btns{display:flex;gap:8px;pointer-events:auto}
.chip{background:rgba(20,18,33,.86);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;font:600 13px var(--f-mono);font-variant-ligatures:none}
.chip:hover{border-color:var(--coral)}
.chip.primary{background:var(--violet);border-color:var(--violet);color:#fff}
#tip{position:fixed;z-index:6;pointer-events:none;font:600 12px var(--f-mono);font-variant-ligatures:none;background:var(--ink);border:1px solid var(--coral);border-radius:7px;padding:5px 9px;color:var(--text);white-space:nowrap;transform:translate(14px,14px)}
#tip .d{color:var(--coral)}
#menu{position:fixed;z-index:7;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;background:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 0 0 1px rgba(255,107,74,.25),0 20px 50px rgba(0,0,0,.5)}
#menu h2{margin:0 0 8px;font:600 13px var(--f-mono);color:var(--muted)}
#menu .grp{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#menu button{background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:40px;cursor:pointer;font:500 12px var(--f-mono);font-variant-ligatures:none}
#menu button:hover{border-color:var(--coral)}
.ctx{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px)}
.panel{position:fixed;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 140px);overflow:auto;background:var(--ink);border-radius:20px;padding:22px 24px;box-shadow:0 0 0 1px rgba(255,107,74,.55),0 0 70px rgba(255,107,74,.2);font:400 14px/1.65 var(--f-mono);font-variant-ligatures:none;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
.panel h2{margin:0 0 12px;font:600 15px var(--f-mono)}
.panel .row{display:grid;grid-template-columns:64px 52px 1fr;gap:10px}
.panel a{color:var(--violet-l)}
.panel a:hover{color:var(--coral-l)}
.panel .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#kbd{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--ink);font:600 15px var(--f-mono);transition:opacity .6s}
#loading.out{opacity:0;pointer-events:none}
#fallback{position:fixed;inset:0;z-index:31;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:var(--ink);font:400 14px/1.7 var(--f-mono)}
#fallback a{color:var(--violet-l)}
/* SergioLearns OS */
#os{position:fixed;inset:0;z-index:20;background:var(--ink-3);overflow:hidden;transform-origin:50% 50%}
#os.on{animation:crtOn .55s cubic-bezier(.2,.8,.2,1)}
#os.off{animation:crtOff .45s ease-in forwards}
@keyframes crtOn{0%{transform:scale(1,.004);filter:brightness(3)}45%{transform:scale(1,.004)}100%{transform:scale(1,1);filter:brightness(1)}}
@keyframes crtOff{0%{transform:scale(1,1)}55%{transform:scale(1,.004);filter:brightness(2.5)}100%{transform:scale(0,.004);filter:brightness(4)}}
#wall{position:absolute;inset:0;width:100%;height:100%}
.os-bar{position:absolute;left:0;right:0;top:0;height:44px;padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(20,18,33,.9);border-bottom:1px solid var(--line);font:600 13px var(--f-mono);font-variant-ligatures:none}
.os-bar .clock{color:var(--muted);font-weight:400}
.os-bar button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font:600 12px var(--f-mono)}
.os-bar button:hover{border-color:var(--coral)}
.dock{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;align-items:flex-end;background:rgba(20,18,33,.9);border:1px solid var(--line);border-radius:20px;padding:8px 10px;max-width:calc(100vw - 32px);overflow-x:auto}
.dock button{background:none;border:1px solid transparent;border-radius:14px;padding:8px 10px;min-width:70px;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font:500 11px var(--f-mono);font-variant-ligatures:none;transition:transform .18s cubic-bezier(.2,.9,.3,1.3)}
.dock button:hover,.dock button:focus-visible{transform:translateY(-6px) scale(1.12);border-color:var(--coral)}
.dock svg{width:26px;height:26px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.win{position:absolute;width:min(620px,calc(100vw - 32px));background:var(--ink-2);border-radius:14px;box-shadow:0 0 0 1px rgba(255,107,74,.45),0 24px 60px rgba(0,0,0,.5);overflow:hidden;animation:winIn .3s cubic-bezier(.2,.9,.3,1.15)}
@keyframes winIn{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
.win-bar{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;background:var(--ink);cursor:grab;font:600 13px var(--f-mono);font-variant-ligatures:none;touch-action:none;user-select:none}
.win-bar button{background:none;border:0;cursor:pointer;color:var(--muted);padding:6px 10px;min-height:32px;font:600 12px var(--f-mono)}
.win-bar button:hover{color:var(--coral-l)}
.win-body{padding:16px 18px;font:400 14px/1.65 var(--f-mono);font-variant-ligatures:none;max-height:min(52vh,420px);overflow:auto}
.win-body a{color:var(--violet-l)}
.term-line{white-space:pre-wrap}
.term-in{display:flex;gap:8px;align-items:center;margin-top:6px}
.term-in label{color:var(--violet-l);white-space:nowrap}
.term-in input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font:400 14px var(--f-mono);caret-color:var(--coral)}
.c-ok{color:var(--ok)}.c-err{color:var(--err)}.c-cmd{color:var(--violet-l)}.c-dim{color:var(--muted)}.c-num{color:var(--amber)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.card-grid a{display:block;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;text-decoration:none;color:var(--text)}
.card-grid a:hover{border-color:var(--coral)}
.card-grid b{display:block;color:var(--violet-l);margin-bottom:4px}
@media (prefers-reduced-motion: reduce){
  .cur{animation:none}#os.on,#os.off,.win,.panel{animation:none}
  .dock button{transition:none}.dock button:hover{transform:none}
}
</style>

<canvas id="gl" aria-label="Escritorio en 3D de SergioLearns. Usa el botón Objetos para manejarlo sin ratón."></canvas>

<div class="hud hud-top" aria-hidden="true">~/escritorio <span class="dollar">$</span> startx<span class="cur">_</span><span class="v">SergioLearns OS v0.1 · prototipo</span></div>

<div id="tip" hidden></div>

<div class="hud hud-bottom">
  <span class="hint" id="hint">Mueve el ratón para mirar · pulsa un objeto · Esc para volver</span>
  <div class="btns">
    <button class="chip" id="btn-back" type="button" hidden>Volver</button>
    <button class="chip" id="btn-menu" type="button" aria-expanded="false" aria-controls="menu">Objetos</button>
  </div>
</div>

<nav id="menu" hidden aria-label="Objetos del escritorio">
  <h2>$ ls ~/escritorio</h2>
  <div class="grp" id="menu-main"></div>
  <h2>$ ls ~/estanteria</h2>
  <div class="grp" id="menu-books"></div>
  <h2>$ ls ~/discos</h2>
  <div class="grp" id="menu-discs"></div>
</nav>

<div class="ctx" id="ctx" hidden></div>
<div class="panel" id="panel" role="dialog" aria-modal="false" aria-labelledby="panel-title" hidden></div>
<input id="kbd" type="text" aria-label="Teclado del escritorio: escribe una orden" autocomplete="off" spellcheck="false">

<div id="os" hidden role="application" aria-label="SergioLearns OS">
  <canvas id="wall" aria-hidden="true"></canvas>
  <div class="os-bar">
    <span>SergioLearns OS <span style="color:var(--coral)">v0.1</span></span>
    <span class="clock" id="clock"></span>
    <button type="button" id="btn-off">apagar</button>
  </div>
  <div id="wins"></div>
  <nav class="dock" id="dock" aria-label="Aplicaciones"></nav>
</div>

<div id="loading" aria-live="polite"><div>~/escritorio <span class="dollar">$</span> cargando la habitación<span class="cur">_</span></div></div>
<div id="fallback" hidden></div>

function drag(W, bar) {

var wallRAF = null;
function startWall() {
  var cv = $('#wall'), g = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2);
  function size() { cv.width = window.innerWidth * dpr; cv.height = window.innerHeight * dpr; }
  size(); window.addEventListener('resize', size);
  var dots = []; for (var i = 0; i < 70; i++) dots.push({ x: Math.random(), y: Math.random(), s: 0.2 + Math.random() * 0.8, c: Math.random() < 0.15 ? '#FF6B4A' : '#A99EF5' });
  function frame(t) {
    var w = cv.width, h = cv.height; g.fillStyle = '#141221'; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(169,158,245,.06)'; g.lineWidth = dpr; var step = 36 * dpr, off = reduced ? 0 : (t / 60) % step;
    g.beginPath(); for (var x = -step + off; x < w; x += step) { g.moveTo(x, 0); g.lineTo(x, h); } for (var y = -step + off; y < h; y += step) { g.moveTo(0, y); g.lineTo(w, y); } g.stroke();
    dots.forEach(function (d) { var yy = ((d.y + (reduced ? 0 : t / 90000 * d.s)) % 1) * h; g.fillStyle = d.c; g.globalAlpha = 0.25 + d.s * 0.35; g.beginPath(); g.arc(d.x * w, yy, 1.6 * dpr + d.s * dpr, 0, Math.PI * 2); g.fill(); });
    g.globalAlpha = 1; g.fillStyle = 'rgba(232,230,245,.07)'; g.font = '600 ' + Math.round(64 * dpr) + 'px ' + DISP; g.textAlign = 'center'; g.fillText('~/sergiolearns', w / 2, h / 2);
    if (Math.floor(t / 530) % 2 === 0) { g.fillStyle = 'rgba(255,107,74,.35)'; g.fillText('_', w / 2 + g.measureText('~/sergiolearns').width / 2 + 24 * dpr, h / 2); }
    wallRAF = requestAnimationFrame(frame);
  }
  wallRAF = requestAnimationFrame(frame);
}
function stopWall() { if (wallRAF) cancelAnimationFrame(wallRAF); wallRAF = null; }
