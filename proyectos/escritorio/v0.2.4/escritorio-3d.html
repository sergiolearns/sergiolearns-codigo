<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El cuarto de Sergio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600&display=swap">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }
</script>
<style>
/* v0.2.4 · El cuarto de Sergio: controles de juego, un uso para cada mueble y el móvil. v0.2.3: el nombre nuevo (E57): inspirado en el suyo y limpio, con el pasillo de la entrada. Fuera del PC no hay interfaz: solo el punto. */
:root{
  --ink:#1E1B2E; --ink-2:#2A2640; --ink-3:#141221; --line:#3A3552;
  --violet:#5B4BDB; --violet-l:#A99EF5; --coral:#FF6B4A; --coral-l:#FF9B80;
  --cream:#FAFAF7; --text:#E8E6F5; --muted:#C9C5DC; --ok:#5BD39A; --err:#FF8A7A; --amber:#F5C06B;
  --f-display:'Space Grotesk','Segoe UI',system-ui,sans-serif;
  --f-body:Inter,'Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink-3);color:var(--text);font-family:var(--f-body);overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none;outline:none}
code,.mono{font-family:var(--f-mono);font-variant-ligatures:none}
/* el punto (E03): cambia de forma según la acción */
#punto{position:fixed;left:0;top:0;z-index:9;pointer-events:none;width:0;height:0;transition:opacity .2s}
#punto .ico{position:absolute;left:-15px;top:-15px;width:30px;height:30px;transition:transform .16s cubic-bezier(.2,.9,.3,1.3);filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
#punto svg{display:block;overflow:visible}
#punto .nombre{position:absolute;left:18px;top:10px;white-space:nowrap;font:500 12px/1 var(--f-body);color:var(--cream);text-shadow:0 1px 3px rgba(0,0,0,.8);opacity:0;transform:translateY(3px);transition:opacity .25s,transform .25s}
#punto.con-nombre .nombre{opacity:.92;transform:none}
#punto.oculto{opacity:0}
/* v0.2.4 (E59-15): el aviso discreto del modo juego («clic para mirar con el ratón») y la mira en el centro */
#captura{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;padding:7px 14px;border-radius:999px;background:rgba(20,18,33,.74);color:var(--muted);font:500 13px var(--f-body);white-space:nowrap;opacity:0;transition:opacity .35s;pointer-events:none}
#captura.on{opacity:1}
body.capturado #punto .nombre{left:-60px;width:120px;top:20px;text-align:center;white-space:normal}
/* velo de inspección: la habitación se oscurece alrededor del objeto */
#velo{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(20,18,33,0) 30%,rgba(20,18,33,.72) 100%);opacity:0;transition:opacity .45s}
#velo.on{opacity:1}
/* recordatorio de teclas, solo las dos primeras veces que se inspecciona */
#teclas{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;display:flex;gap:18px;font:500 13px var(--f-body);color:var(--muted);opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#teclas.on{opacity:1}
#teclas kbd{display:inline-block;min-width:24px;padding:2px 7px;margin-right:6px;border:1px solid rgba(201,197,220,.5);border-bottom-width:2px;border-radius:6px;font:600 12px var(--f-mono);font-variant-ligatures:none;color:var(--cream);text-align:center}
/* accesibilidad (E20): invisible hasta que se usa el teclado */
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#saltar{position:fixed;left:16px;top:16px;z-index:40;padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--text);font:500 14px var(--f-body);box-shadow:0 0 0 2px var(--coral);text-decoration:none;transform:translateY(-200%)}
#saltar:focus{transform:none;outline:none}
#objetos button{all:unset}
#etiqueta{position:fixed;z-index:8;pointer-events:none;transform:translate(-50%,-140%);padding:6px 10px;border-radius:8px;background:rgba(20,18,33,.86);box-shadow:0 0 0 2px var(--coral);font:500 13px var(--f-body);color:var(--cream);white-space:nowrap}
:focus-visible{outline:2px solid var(--coral);outline-offset:3px}
#entrada{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
/* la señal entre la realidad y lo virtual (E51): un lienzo encima de todo mientras se entra en la pantalla */
#senal{position:fixed;inset:0;z-index:25;width:100%;height:100%;pointer-events:none;display:block}
#carga{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--ink-3);font:500 15px var(--f-body);color:var(--muted);transition:opacity .6s}
#carga.fuera{opacity:0;pointer-events:none}
#sin3d{position:fixed;inset:0;z-index:31;display:grid;place-items:center;padding:24px;background:var(--ink);font:400 15px/1.7 var(--f-body)}
#sin3d a{color:var(--violet-l)}
/* SergioLearns OS (mundo virtual: aquí sí hay terminal). Se rehace en la v0.3 */
#os{position:fixed;inset:0;z-index:20;background:var(--ink-3);overflow:hidden;transform-origin:50% 50%;cursor:default}
#os.on{animation:crtOn .55s cubic-bezier(.2,.8,.2,1)}
#os.off{animation:crtOff .45s ease-in forwards}
@keyframes crtOn{0%{transform:scale(1,.004);filter:brightness(3)}45%{transform:scale(1,.004)}100%{transform:scale(1,1);filter:brightness(1)}}
@keyframes crtOff{0%{transform:scale(1,1)}55%{transform:scale(1,.004);filter:brightness(2.5)}100%{transform:scale(0,.004);filter:brightness(4)}}
#wall{position:absolute;inset:0;width:100%;height:100%}
.os-bar{position:absolute;left:0;right:0;top:0;height:44px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(20,18,33,.9);border-bottom:1px solid var(--line);font:600 13px var(--f-mono);font-variant-ligatures:none}
.os-bar .clock{color:var(--muted);font-weight:400}
.dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(20,18,33,.9);border:1px solid var(--line);border-radius:20px;padding:8px 10px;max-width:calc(100vw - 32px);overflow-x:auto}
.dock button{background:none;border:1px solid transparent;border-radius:14px;padding:8px 10px;min-width:70px;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:var(--text);font:500 11px var(--f-mono);font-variant-ligatures:none;transition:transform .18s cubic-bezier(.2,.9,.3,1.3)}
.dock button:hover,.dock button:focus-visible{transform:translateY(-6px) scale(1.12);border-color:var(--coral)}
.dock svg{width:26px;height:26px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.win{position:absolute;width:min(640px,calc(100vw - 32px));background:var(--ink-2);border-radius:14px;box-shadow:0 0 0 1px rgba(255,107,74,.45),0 24px 60px rgba(0,0,0,.5);overflow:hidden;animation:winIn .3s cubic-bezier(.2,.9,.3,1.15)}
@keyframes winIn{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
.win-bar{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;background:var(--ink);cursor:grab;font:600 13px var(--f-mono);font-variant-ligatures:none;touch-action:none;user-select:none}
.win-bar button{background:none;border:0;cursor:pointer;color:var(--muted);padding:6px 10px;min-height:32px;font:600 12px var(--f-mono)}
.win-bar button:hover{color:var(--coral-l)}
.win-body{padding:16px 18px;font:400 14px/1.65 var(--f-mono);font-variant-ligatures:none;max-height:min(56vh,460px);overflow:auto;white-space:normal}
.win-body a{color:var(--violet-l)}
.win-body pre{margin:0;white-space:pre-wrap;font:inherit}
.term-line{white-space:pre-wrap}
.term-in{display:flex;gap:8px;align-items:center;margin-top:6px}
.term-in label{color:var(--violet-l);white-space:nowrap}
.term-in input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font:400 14px var(--f-mono);font-variant-ligatures:none;caret-color:var(--coral)}
.c-ok{color:var(--ok)}.c-err{color:var(--err)}.c-cmd{color:var(--violet-l)}.c-dim{color:var(--muted)}.c-num{color:var(--amber)}.c-co{color:var(--coral)}
.dollar{color:var(--coral)}
@media (prefers-reduced-motion: reduce){
  #os.on,#os.off,.win{animation:none}
  .dock button,#punto .ico,#velo,#teclas{transition:none}
}
</style>
</head>
<body>
<a id="saltar" href="https://sergiolearns.com/">Ir a la web normal, sin 3D</a>
<canvas id="gl" tabindex="-1" aria-label="El cuarto de Sergio en 3D. Usa el tabulador para recorrer los objetos y los sitios; WASD para caminar; el manual está en la estantería."></canvas>
<nav id="objetos" class="sr" aria-label="Objetos y sitios del cuarto"></nav>

<div id="etiqueta" hidden aria-hidden="true"></div>
<div id="teclas" aria-hidden="true"></div>
<input id="entrada" type="text" aria-label="Escribe" autocomplete="off" spellcheck="false">
<div id="os" hidden role="application" aria-label="SergioLearns OS">
  <canvas id="wall" aria-hidden="true"></canvas>
  <div class="os-bar"><span>SergioLearns OS <span class="c-co">v0.2</span></span><span class="clock" id="clock"></span><span class="c-dim">shutdown · Esc</span></div>
  <div id="wins"></div>
  <nav class="dock" id="dock" aria-label="Aplicaciones"></nav>
</div>
<canvas id="senal" hidden aria-hidden="true"></canvas>
<div id="carga" aria-live="polite">Entrando en el cuarto de Sergio…</div>
<div id="sin3d" hidden></div>
<script type="module">
/* ===================== 01 · núcleo =====================
   Motor (three.js como módulo), utilidades de geometría y texturas,
   animaciones (curvas, anim() con promesas y muelles) y el «bus» de eventos
   con el que se avisan los módulos entre sí. */
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { Reflector } from 'three/addons/objects/Reflector.js';   // v0.2.3: el espejo del armario (E56-11)

let reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
try { if (localStorage.getItem('sl-escritorio-reducir') === 'true') reduced = true; } catch (e) { /* sin almacenamiento */ }   // v0.2.4: también desde Ajustes del móvil
const $ = s => document.querySelector(s);
const VERSION = 'v0.2.4';
const NOMBRE = 'El cuarto de Sergio';   // E57 (decisión de Sergio, 5 nov 2026): el proyecto ya es un cuarto
// Para probar: ?hora=21 fuerza la hora de Canarias (0-24, admite 21.5), ?lluvia=1 o 0 fuerza el tiempo
const PARAMS = new URLSearchParams(location.search);

/* ---------- bus: los módulos se avisan sin conocerse ---------- */
const bus = {
  oy: {},
  on(ev, fn) { (this.oy[ev] = this.oy[ev] || []).push(fn); },
  emit(ev, dato) { (this.oy[ev] || []).forEach(fn => fn(dato)); }
};

/* ---------- guardado por persona (solo comodidades: puede fallar) ---------- */
const guardado = {
  get(k, def) { try { const v = localStorage.getItem('sl-escritorio-' + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem('sl-escritorio-' + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento: no pasa nada */ } }
};

/* ---------- WebGL ---------- */
const canvas = $('#gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer || !renderer.getContext()) {
  const fb = $('#sin3d');
  fb.innerHTML = '<div><p>Este navegador no puede dibujar la habitación en 3D (WebGL).</p>' +
    '<p>Todo lo que hay en ella está también en la web: <a href="https://sergiolearns.com/aprende/">Aprende</a> · <a href="https://sergiolearns.com/laboratorio/">Laboratorio</a> · <a href="https://sergiolearns.com/universidad/">Universidad</a></p></div>';
  fb.hidden = false; $('#carga').hidden = true;
  throw new Error('sin WebGL');
}
/* ---------- resolución (v0.2.3, fallo 19: la caída de fps a pantalla completa) ----------
   El coste de dibujar crece con los píxeles: a pantalla completa en un portátil con escalado (×1,5 o ×2), la v0.2.2
   pintaba hasta 3840 × 2160 = 8,3 millones de píxeles por fotograma, 9 veces los de una ventana de 1280 × 720
   (medido: material/v0.2.3/medidas.md). Tres frenos:
   · un TOPE de densidad (×1,5 como mucho, antes ×2) y un PRESUPUESTO de píxeles (2,4 millones, un 1920 × 1080 a ×1,1);
   · una ESCALA ADAPTATIVA: si el fotograma tarda más de 1/45 s durante 1,5 s, se dibuja con un 15 % menos de
     resolución (hasta la mitad); si va holgado (menos de 1/57 s) durante 4 s, sube un 10 %. Los cambios, como
     mucho uno cada 1,5 s (cambiar el tamaño del lienzo cuesta);
   · ?res=1 la fija (para grabar clips y medir); ?fps enseña un panel con los números (para probarlo en un portátil). */
const RES = { tope: 1.5, presupuesto: 2.4e6, escala: 1, min: 0.5, fija: PARAMS.get('res') === '1', ema: 1 / 60, lento: 0, holgado: 0, ultCambio: 0, cambios: 0 };
function ratioBase() {
  const dpr = Math.min(window.devicePixelRatio || 1, RES.tope), px = innerWidth * innerHeight;
  return Math.min(dpr, Math.sqrt(RES.presupuesto / Math.max(1, px)));
}
function aplicaRes() { renderer.setPixelRatio(ratioBase() * RES.escala); renderer.setSize(innerWidth, innerHeight, false); }
function corrRes(dt, ahora) {
  if (RES.fija || dt <= 0) return;
  RES.ema += (dt - RES.ema) * 0.08;                                  // media exponencial del tiempo por fotograma
  if (RES.ema > 1 / 45) { RES.lento += dt; RES.holgado = 0; } else if (RES.ema < 1 / 57) { RES.holgado += dt; RES.lento = 0; } else { RES.lento = RES.holgado = 0; }
  if (ahora - RES.ultCambio < 1500) return;
  let nueva = RES.escala;
  if (RES.lento > 1.5 && RES.escala > RES.min) nueva = Math.max(RES.min, RES.escala * 0.85);
  else if (RES.holgado > 4 && RES.escala < 1) nueva = Math.min(1, RES.escala * 1.1);
  if (nueva !== RES.escala) { RES.escala = nueva; RES.ultCambio = ahora; RES.lento = RES.holgado = 0; RES.cambios++; aplicaRes(); }
}
renderer.setPixelRatio(ratioBase());
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141221);
scene.fog = new THREE.Fog(0x141221, 5.5, 11);           // v0.2.2: el cuarto mide 4,3 m de fondo
const camera = new THREE.PerspectiveCamera(62, 1, 0.012, 600);   // lejos: el paisaje 3D llega a 400 m
const BASE = new THREE.Vector3(0, 1.22, 0.55);   // los ojos de alguien sentado
const DE_PIE = 1.62;                              // v0.2.2: los ojos de pie (se camina por el cuarto)
const MESA_Y = 0.74, PLANO_Y = 0.765;            // tablero de la mesa y plano de trabajo para arrastrar

/* ---------- geometría ---------- */
function mat(color, o = {}) {
  // v0.2.3 (fallo 19): lo mate (rugosidad ≥ 0,88 y sin metal: paredes, telas, ropa, papel) va con Lambert, que en cada
  // píxel hace la cuenta de la luz difusa y no la del brillo (GGX): a pantalla completa es mucho más barato y se ve igual
  if ((o.r ?? 0.82) >= 0.88 && !(o.m > 0.05) && !o.metal) return new THREE.MeshLambertMaterial({
    color, emissive: o.e ?? 0x000000, emissiveIntensity: o.ei ?? 0, map: o.map ?? null, transparent: !!o.t, opacity: o.op ?? 1, side: o.side ?? THREE.FrontSide });
  return new THREE.MeshStandardMaterial({
    color, roughness: o.r ?? 0.82, metalness: o.m ?? 0.04,
    emissive: o.e ?? 0x000000, emissiveIntensity: o.ei ?? 0, map: o.map ?? null,
    transparent: !!o.t, opacity: o.op ?? 1, side: o.side ?? THREE.FrontSide
  });
}
function box(w, h, d, m, x = 0, y = 0, z = 0, padre = scene) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y, z); padre.add(mesh); return mesh;
}
// v0.2.2: caja con las esquinas redondeadas (modelos más modernos, E46)
function rbox(w, h, d, r, m, x = 0, y = 0, z = 0, padre = scene, seg = 3) {
  const mesh = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2, h / 2, d / 2) * 0.999), m);
  mesh.position.set(x, y, z); padre.add(mesh); return mesh;
}
function cyl(rt, rb, h, m, x = 0, y = 0, z = 0, padre = scene, seg = 32) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  mesh.position.set(x, y, z); padre.add(mesh); return mesh;
}
function plano(w, h, m, x = 0, y = 0, z = 0, rx = 0, ry = 0, padre = scene) {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
  p.position.set(x, y, z); p.rotation.set(rx, ry, 0); padre.add(p); return p;
}

/* ---------- texturas dibujadas en un lienzo ---------- */
const MONO = '"JetBrains Mono", ui-monospace, Consolas, monospace';
const DISP = '"Space Grotesk", "Segoe UI", sans-serif';
const BODY = 'Inter, "Segoe UI", sans-serif';
const MANO = 'Caveat, "Segoe Print", cursive';   // la letra a mano (pizarra, etiquetas de los discos)
const TEXTURAS = [];   // las que se redibujan cuando cargan las fuentes
function texFrom(w, h, dibuja) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); if (dibuja) dibuja(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.userData = { canvas: c, g, dibuja };
  if (dibuja) TEXTURAS.push(t);
  return t;
}
function redibuja(t, dibuja) { const { canvas: c, g } = t.userData; g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height); g.restore(); (dibuja || t.userData.dibuja)(g, c.width, c.height); t.needsUpdate = true; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
// v0.2.3 (E56-25, textos cortados): escribe una línea que CABE en maxW: si no cabe, baja el tamaño de la letra (hasta el 60 %)
function cabe(g, texto, x, y, maxW, size, peso = '500', familia = BODY) {
  let s = size; g.font = peso + ' ' + s + 'px ' + familia;
  while (s > size * 0.6 && g.measureText(texto).width > maxW) { s -= 1; g.font = peso + ' ' + s + 'px ' + familia; }
  g.fillText(texto, x, y); return s;
}
function wrap(g, texto, x, y, maxW, lh) {
  const palabras = texto.split(' '); let linea = '';
  for (const p of palabras) {
    const t = linea ? linea + ' ' + p : p;
    if (g.measureText(t).width > maxW && linea) { g.fillText(linea, x, y); linea = p; y += lh; } else linea = t;
  }
  if (linea) g.fillText(linea, x, y);
  return y;
}

/* ---------- animaciones ---------- */
// Curvas: reciben el avance x (0 → 1) y devuelven cuánto se ha movido (puede pasar de 1 en las que rebotan)
const curva = {
  lineal: x => x,
  suave: x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),   // cúbica de entrada y salida (la de la v0.1)
  sale: x => 1 - Math.pow(1 - x, 3),                                        // frena al final
  entra: x => x * x * x,                                                     // arranca despacio
  retroceso: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }, // se pasa y vuelve
  rebote: x => {                                                             // cae y rebota (disco en la bandeja)
    const n = 7.5625, d = 2.75;
    if (x < 1 / d) return n * x * x;
    if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75;
    if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375;
    return n * (x -= 2.625 / d) * x + 0.984375;
  }
};
const anims = [];
// anim(duración en ms, función que recibe el avance ya curvado, curva) → promesa que se cumple al terminar
function anim(dur, fn, ease = curva.suave) {
  return new Promise(resolve => {

class Muelle {

  paso(dt) {
    if (reduced) { this.x = this.obj; this.v = 0; return this.x; }
    const sub = Math.ceil(dt / 0.008), h = dt / sub;          // pasos pequeños para que no se vuelva inestable

      this.v += a * h; this.x += this.v * h;                  // Euler semiimplícito: primero la velocidad

const objetos = new Map(), pickables = [];
function mats(m) { return Array.isArray(m.material) ? m.material : [m.material]; }
/* registrar(clave, {nombre, mallas, raiz, movil, alClic, alUsar, alArrastrar, insp, activo}) */
function registrar(clave, o) {
  o.clave = clave;

  objetos.set(clave, o);
  o.mallas.forEach(m => {

    mats(m).forEach(x => { if (x.emissive) { x.userData.e0 = x.emissive.getHex(); x.userData.ei0 = x.emissiveIntensity; } });
  });

function brillo(mallas, k, color = 0xFF6B4A) {
  mallas.forEach(m => mats(m).forEach(x => {

  if (control.modo === 'juego' && !control.bloqueado && PL_OK && $('#os').hidden && (MODOS_CAMARA.has(gesto.estado) || gesto.estado === 'inspeccion')) {
    // el primer clic solo captura el ratón (no coge nada: así no se coge algo sin querer al volver)
    control.comerClic = true; pideCaptura(); return;
  }
  if (!control.bloqueado) return alPulsar(e);
  const est = gesto.estado;
  if (est === 'inspeccion') { control.inspPulsado = performance.now(); return; }   // el clic izquierdo en la mano = usar (al soltar)
  if (MODOS_CAMARA.has(est)) {
    if (est !== 'libre') return;
    ndc.set(0, 0); const r = pick();
    gesto.pulsado = { x: 0, y: 0, o: r && r.o, hit: r && r.hit, t: performance.now(), listo: false, lejos: false, dMax: 0 };
    if (r && r.o && !r.o.movil && r.o.alArrastrar && alcanza(r.o)) {    // un cajón: se agarra y se mueve con el cursor propio
      control.cursor = { x: innerWidth / 2, y: innerHeight / 2 }; const v = virtual(e); gesto.pulsado = null; r.o.alArrastrar.empieza({ x: v.clientX, y: v.clientY, o: r.o, hit: r.hit, t: performance.now() }, v); gesto.arrastre = r.o;
    }
    return;
  }
  const v = virtual(e); aNdc(v); const m = modos[est]; if (m && m.down) m.down(v);
}
function entradaSoltar(e) {
  if (e.button === 2) return;
  if (control.comerClic) { control.comerClic = false; return; }
  if (!control.bloqueado) return alSoltar(e);
  const est = gesto.estado;
  if (gesto.arrastre && gesto.arrastre.alArrastrar) { const o = gesto.arrastre; gesto.arrastre = null; o.alArrastrar.suelta(virtual(e)); return; }
  if (est === 'inspeccion') { if (control.inspPulsado && performance.now() - control.inspPulsado < 400 && insp.o) usa(insp.o); control.inspPulsado = 0; return; }
  if (est === 'llevar') { sueltaLlevar(); return; }
  if (est === 'pegar') { modos.pegar.up(); return; }
  if (MODOS_CAMARA.has(est)) {
    const p = gesto.pulsado; gesto.pulsado = null;
    if (p && p.o) registroClic(p, p.lejos ? 'nada (se giró)' : 'clic (mira)', p.dMax);
    if (p && p.o && !p.lejos && est === 'libre') clicEn(p.o, p.hit, e);
    return;
  }
  const v = virtual(e); aNdc(v); const m = modos[est]; if (m && m.up) m.up(v);
}
canvas.addEventListener('pointermove', entradaMover);
canvas.addEventListener('pointerdown', entradaPulsar);
canvas.addEventListener('pointerup', entradaSoltar);
canvas.addEventListener('contextmenu', e => e.preventDefault());
// al cambiar de estado con el ratón capturado: en los modos de cursor, el cursor propio empieza en el centro; en los de
// cámara, la mira vuelve al centro. Entrar en el PC suelta el ratón
bus.on('estado', est => {
  if (est === 'os') { sueltaCaptura(); return; }
  if (!control.bloqueado) { actualizaAvisoCaptura(); return; }
  if (MODOS_CAMARA.has(est) || est === 'inspeccion') { ndc.set(0, 0); rig.mx = rig.my = 0; colocaPunto(innerWidth / 2, innerHeight / 2); }
  else if (est !== _virtualAntes) { control.cursor = { x: innerWidth / 2, y: innerHeight / 2 }; colocaPunto(control.cursor.x, control.cursor.y); }
  _virtualAntes = est; actualizaAvisoCaptura();
});
// el aviso discreto «clic para mirar con el ratón» (solo en el modo juego, con el ratón suelto y sin nada abierto)
const avisoEl = (() => { const d = document.createElement('div'); d.id = 'captura'; d.setAttribute('aria-hidden', 'true'); document.body.appendChild(d); return d; })();
function avisoCaptura(t) { avisoEl.textContent = t; avisoEl.classList.add('on'); clearTimeout(avisoEl._t); avisoEl._t = setTimeout(() => avisoEl.classList.remove('on'), 3200); }

   Qué hace cada objeto: disco a la disquetera y USB al puerto (E05, E24),
   cajón con peso (E09), carpeta que se abre en la mesa (E07), taza con

/* ---------- torre: disquetera ---------- */
const torre = { disco: null, usb: null, bandeja: 0 };   // bandeja: 0 cerrada, 1 abierta
function mueveBandeja(a, dur = 380) { const b0 = torre.bandeja; return anim(dur, e => { torre.bandeja = lerp(b0, a, e); tray.position.z = lerp(TRAY_CERRADA, TRAY_ABIERTA, torre.bandeja); }, curva.suave); }
// v0.2.1 (E35): la zona está DELANTE de la bandeja abierta (no encima): el disco llega por delante y entra deslizándose
const DELANTE_BANDEJA = v3(TORRE.x, 1.098, -0.152 + 0.1);
const zonaDisquetera = zona({
  clave: 'disquetera', punto: DELANTE_BANDEJA, radio: 0.32, mallas: [slot, trayMesh], quat: new THREE.Quaternion(),
  acepta: o => o.tipo === 'disco',
  alEntrar: () => { if (!torre.disco) mueveBandeja(1); },
  alSalir: () => { if (!torre.disco) mueveBandeja(0); },
  encaja: o => meteDisco(o)
});
USOS.disco = o => meteDisco(o);
async function meteDisco(o) {
  cambia('ocupado'); gesto.obj = o;
  if (torre.disco && torre.disco !== o) await sacaDisco(false);
  if (torre.bandeja < 1) await mueveBandeja(1);
  scene.attach(o.raiz);
  tray.updateMatrixWorld(true);
  // recorrido (E35): delante de la bandeja y algo más alto → se desliza hacia dentro rozando → se asienta con un rebote
  const delante = new THREE.Vector3(0, 0.018, 0.1).applyMatrix4(tray.matrixWorld);
  const roza = new THREE.Vector3(0, 0.014, 0).applyMatrix4(tray.matrixWorld), dentro = new THREE.Vector3(0, 0.006, 0).applyMatrix4(tray.matrixWorld);
  const p0 = o.raiz.position.clone(), q0 = o.raiz.quaternion.clone(), q1 = new THREE.Quaternion();
  // si viene de lejos (con E desde la mano), llega en arco por encima de todo
  const C = p0.clone().lerp(delante, 0.5); C.y = Math.max(p0.y, delante.y) + 0.05;
  await anim(480, e => { bezier2(p0, C, delante, e, o.raiz.position); o.raiz.quaternion.slerpQuaternions(q0, q1, Math.min(1, e * 1.3)); }, curva.suave);
  await anim(300, e => o.raiz.position.lerpVectors(delante, roza, e), curva.sale);
  await anim(220, e => o.raiz.position.lerpVectors(roza, dentro, e), curva.rebote);   // se asienta
  tray.attach(o.raiz);                                                                  // a partir de aquí se mueve con la bandeja
  await mueveBandeja(0, 460);
  torre.disco = o; gesto.obj = null; $('#velo').classList.remove('on');
  pantalla.pon('simulacro', o.datos); parpadeoLed(1400);
  miraMonitor('Simulacro ' + o.datos.code + ' cargado en el monitor. Clic en la pantalla para abrirlo, Esc para volver.');
}
// Lo que enseña el monitor según lo que hay en la torre (E35: al sacar el disco o el USB, vuelve a lo que toca)
function pantallaSegunTorre() {
  if (torre.disco) pantalla.pon('simulacro', torre.disco.datos);
  else if (torre.usb) pantalla.pon('simulador', torre.usb.datos);
  else pantalla.pon('reposo');
}
async function sacaDisco(volverLibre = true) {
  const o = torre.disco; if (!o) return;
  if (volverLibre) cambia('ocupado');
  await mueveBandeja(1);
  scene.attach(o.raiz); torre.disco = null; pantallaSegunTorre();
  // sale de la bandeja por delante antes de volar al estuche
  tray.updateMatrixWorld(true);
  const p0 = o.raiz.position.clone(), fuera = new THREE.Vector3(0, 0.02, 0.1).applyMatrix4(tray.matrixWorld);
  await anim(280, e => o.raiz.position.lerpVectors(p0, fuera, e), curva.suave);
  await volverACasa(o, 620);
  await mueveBandeja(0);
  if (volverLibre) { cambia('libre'); bus.emit('vuelve'); }
}
// v0.2.4 (E59-1): expulsar ya no devuelve el disco al estuche de golpe: sale de la bandeja y viene A LA MANO (inspección),
// como cualquier objeto que coges. Esc lo deja en el estuche; E lo vuelve a meter
async function expulsaALaMano() {
  const o = torre.disco; if (!o) return;
  cambia('ocupado'); setHover(null);
  await mueveBandeja(1);
  scene.attach(o.raiz); torre.disco = null; pantallaSegunTorre();
  tray.updateMatrixWorld(true);
  const p0 = o.raiz.position.clone(), fuera = new THREE.Vector3(0, 0.03, 0.12).applyMatrix4(tray.matrixWorld);
  await anim(reduced ? 1 : 300, e => o.raiz.position.lerpVectors(p0, fuera, e), curva.sale);
  mueveBandeja(0);
  cambia('libre'); await inspecciona(o, { yaFuera: true });
}
registrar('expulsar', { nombre: 'Botón de expulsar', mallas: [ejectBtn], alClic: () => {
  if (!torre.disco) { mueveBandeja(torre.bandeja > 0.5 ? 0 : 1); return; }
  expulsaALaMano();
} });

/* ---------- taza: Sergio Bot en el vapor (E10, decisión de Sergio del 4 nov) ---------- */
const botTex = texFrom(1024, 600);
const botPlano = new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.27), new THREE.MeshBasicMaterial({ map: botTex, transparent: true, opacity: 0, depthWrite: false, toneMapped: false }));
botPlano.visible = false; scene.add(botPlano);

USOS.taza = async o => {
  cambia('ocupado');
  const p0 = o.raiz.position.clone(), q0 = o.raiz.quaternion.clone();
  const dir = camera.getWorldDirection(new THREE.Vector3());
  const cerca = camera.position.clone().addScaledVector(dir, 0.3).add(v3(0, -0.12, 0));
  const q1 = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, cam.yaw + 2.2, 0));
  await anim(600, e => { o.raiz.position.lerpVectors(p0, cerca, e); o.raiz.quaternion.slerpQuaternions(q0, q1, e); vapor.espeso = e; }, curva.suave);
  botPlano.position.copy(camera.position).addScaledVector(dir, 0.52).add(v3(0, 0.02, 0));
  botPlano.quaternion.copy(camera.quaternion); botPlano.visible = true;
  bot.revela = 1e9; dibujaBot(0);
  await anim(500, e => { botPlano.material.opacity = e; botPlano.scale.setScalar(0.85 + 0.15 * e); }, curva.sale);
  cambia('bot'); const inp = $('#entrada'); inp.value = ''; inp.focus({ preventScroll: true });

};
function respuestaBot(q) { for (const [re, r] of BOT) if (re.test(q)) return r; return BOT_OTRA; }
function dibujaBot(t) {
  redibuja(botTex, (c, w, h) => {
    c.textBaseline = 'alphabetic';
    c.shadowColor = 'rgba(169,158,245,.7)'; c.shadowBlur = 18;
    c.fillStyle = 'rgba(250,250,247,.95)'; c.font = '600 40px ' + DISP; c.fillText('Sergio Bot', 40, 64);
    c.font = '500 24px ' + BODY; c.fillStyle = 'rgba(232,230,245,.75)'; c.fillText('en el vapor del café · respuestas de ejemplo', 40, 102);
    let y = 160;
    const ult = bot.msgs.slice(-3);
    ult.forEach((m, i) => {
      const onda = reduced ? 0 : Math.sin(t / 700 + i) * 3;
      c.font = (m.de === 'tu' ? '600 ' : '400 ') + '36px ' + BODY; c.fillStyle = m.de === 'tu' ? 'rgba(255,155,128,.98)' : 'rgba(250,250,247,.96)';
      let txt = (m.de === 'tu' ? 'Tú: ' : '') + m.t;
      if (i === ult.length - 1 && m.de === 'bot') txt = txt.slice(0, Math.floor(bot.revela));
      y = wrap(c, txt, 40 + onda, y, w - 80, 46) + 56;
    });
    c.shadowBlur = 10; c.font = '400 34px ' + BODY; c.fillStyle = 'rgba(250,250,247,.9)';
    const caret = Math.floor(t / 500) % 2 ? '' : '_';
    c.fillText((bot.escrito || '') + caret, 40, h - 40);
    if (!bot.escrito) { c.fillStyle = 'rgba(232,230,245,.55)'; c.fillText('Escribe tu pregunta…', 40 + c.measureText(caret).width + 4, h - 40); }

async function pasa(dir, desde = 0, agarre = 0) {

  R.dorso.material.map = texEspejo(dorso < N ? texPagina(dorso) : texGuarda()); R.dorso.material.needsUpdate = true;
  // lo que queda debajo de la hoja mientras gira

  else { R.pagIzq.material.map = k - 1 === 0 ? texGuarda() : texPagina(2 * k - 3); R.pagIzq.visible = k - 1 > 0; }

  R.pivote.attach(R.bloqueIzq); R.pivote.attach(R.pagIzq);

const FONDO_PIZARRA = '#F4F3F8';

/* ---------- lo escrito: una lista de operaciones que se guarda ---------- */
const MAX_PUNTOS = 24000;   // lo que cabe holgado en el almacenamiento del navegador

let guardaPend = 0;
function guardaPizarra() {
  clearTimeout(guardaPend);
  guardaPend = setTimeout(() => {
    let total = pizOps.reduce((n, op) => n + (op.p ? op.p.length : 1), 0);
    while (total > MAX_PUNTOS && pizOps.length > 1) { const v = pizOps.shift(); total -= v.p ? v.p.length : 1; }
    guardado.set('pizarra', { v: 1, ops: pizOps });

}
function pintaOp(c, op) {

  if (op.t === 'limpia') {                       // la pizarra limpia, con los restos de borrado de siempre
    c.fillStyle = FONDO_PIZARRA; c.fillRect(0, 0, PW, PH);
    let sem = 9; const rnd = () => (sem = (sem * 16807) % 2147483647) / 2147483647;
    c.fillStyle = 'rgba(30,27,46,.035)'; for (let i = 0; i < 60; i++) c.fillRect(rnd() * PW, rnd() * PH, 160, 3);
    return;
  }
  if (op.t === 'nota') {
    c.save(); c.fillStyle = op.c; c.font = '700 ' + op.s + 'px ' + MANO;
    op.txt.split('\n').forEach((l, i) => c.fillText(l, op.x, op.y + i * op.s * 1.05)); c.restore(); return;
  }
  const p = op.p; if (!p || !p.length) return;
  c.save();
  if (op.t === 'borra') { c.strokeStyle = op.capa ? '#000' : FONDO_PIZARRA; if (op.capa) c.globalCompositeOperation = 'destination-out'; } else c.strokeStyle = op.c;
  c.lineWidth = op.w; c.lineCap = 'round'; c.lineJoin = 'round'; c.fillStyle = op.c || '#000';
  if (p.length === 1) { c.beginPath(); c.arc(p[0][0], p[0][1], op.w / 2, 0, Math.PI * 2); c.fill(); }
  else { c.beginPath(); c.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) c.lineTo(p[i][0], p[i][1]); c.stroke(); }
  c.restore();
}

  box(0.0185, 0.03, 0.0185, mat(new THREE.Color(color).getHex(), { r: 0.6 }), 0, 0.005, 0, g);
  box(0.008, 0.016, 0.008, mat(0x1E1B2E), 0, -0.048, 0, g);       // la punta (−y)

}

  rojo: { g: creaRotulador(COLORES.rojo), casa: { pos: v3(SALA.x1 - 0.035, 1.0, PIZ.z - 0.32) }, nombre: 'Rotulador rojo' },

  const TRAZOS = letra === 'V' ? [[[0.2, 0.14], [0.5, 0.86], [0.8, 0.14]]] : [[[0.32, 0.1], [0.32, 0.9]], [[0.32, 0.12], [0.8, 0.12]], [[0.32, 0.48], [0.68, 0.48]]];

      rot.position.copy(enPizarra(q.x, q.y).add(v3(-0.055, 0.02, 0))); rot.quaternion.copy(Q_ESCRIBE);
    }, curva.lineal);
  }

  const lineas = [[bien ? '¡Bien! Es falso.' : 'Casi: es falso.', tinta, 44], ...PREGUNTA.explica.map(t => [t, tinta, 34])];
  let yy = 494;
  for (const [txt, color, tam] of lineas) { await escribeLinea(c, txt, 540, yy, color, tam, rot); yy += tam + 10; }
  piz.respuesta = letra; piz.escribiendo = false;
  anuncia((bien ? 'Correcto. ' : 'No es correcto. ') + PREGUNTA.explica.join(' '));
}
async function escribeLinea(c, txt, x, y, color, tam, rot) {
  const tmp = document.createElement('canvas'); tmp.width = PW; tmp.height = tam + 30; const t = tmp.getContext('2d');
  t.font = '700 ' + tam + 'px ' + MANO; t.fillStyle = color; t.fillText(txt, x, tam); const ancho = t.measureText(txt).width;

    hecho = hasta - x; componePizarra();
    rot.position.copy(enPizarra(hasta, y - tam * 0.35).add(v3(-0.055, 0.02, 0)));

      if (!reduced) {

        const by = ((p * 1.3) % 1) * H; g.fillStyle = 'rgba(232,230,245,' + 0.22 * i + ')'; g.fillRect(0, by, W, H * 0.04);       // la franja que baja

        [['rgba(255,107,74,', -1], ['rgba(91,211,154,', 0], ['rgba(91,75,219,', 1]].forEach(([col, k]) => { g.fillStyle = col + 0.55 * i + ')'; g.fillText('sergiolearns_', W / 2 + k * 10 * i * dpr, H / 2); });
        for (let k = 0; k < 7; k++) { const y = r() * H, hh = 4 + r() * 18, dx = (r() - 0.5) * 60 * i; g.drawImage(senalCv, 0, y, W, hh, dx, y, W, hh); }   // saltos

  }, reduced ? 0 : retraso));
}

/* ===================== 12 · el cuarto: caminar y que todo sirva (E48-E52, E55, E56) =====================
   «El cuarto de Sergio» (E57). Se recorre:
   · Clic en un sitio (un mueble): se camina hasta él por el camino más corto (A* en una rejilla de 5 cm, tensado) y,
     en el último tramo, la vista ya va girando hacia el mueble (v0.2.3: antes se paraba y después giraba).
   · WASD: caminar libre. Colisiones: un círculo (la persona, 0,22 m) contra rectángulos (los muebles) y la silla.

const tramo = (e, a, b) => clamp((e - a) / (b - a), 0, 1);   // la parte de una animación entre a y b, de 0 a 1

/* ---------- caminar hasta un punto (con un clic) ---------- */

/* ---------- caminar libre con WASD ---------- */
function corrMovimiento(dt) {
  const T = caminar.teclas; if (!T.size || gesto.estado !== 'libre' || caminar.activo) return;
  if (jug.sentado) { if (T.has('w') || T.has('s')) { cambia('ocupado'); levantate().then(() => cambia('libre')); } return; }
  if (enSillon.si) { cambia('ocupado'); levantaDelSillon().then(() => cambia('libre')); return; }
  let f = (T.has('w') ? 1 : 0) - (T.has('s') ? 1 : 0), l = (T.has('d') ? 1 : 0) - (T.has('a') ? 1 : 0); if (!f && !l) return;
  const n = Math.hypot(f, l); f /= n; l /= n;
  const v = caminar.vel * (caminar.correr ? 1.7 : 1);              // v0.2.4: Mayús corre (2,3 m/s)
  const y = cam.yaw, vx = (-Math.sin(y) * f + Math.cos(y) * l) * v * dt, vz = (-Math.cos(y) * f - Math.sin(y) * l) * v * dt;
  const [x, z] = empujaFuera(jug.pos.x + vx, jug.pos.z + vz);
  jug.pos.x = x; jug.pos.z = z; jug.en = null;
  if (rig.foco && rig.foco.rate === 4) sueltaFoco();
}

   del examen de FP1. Un clic en una línea con «→» abre ese artículo en la web; solo llevan enlace los que ya han salido
   (lo programado no se enlaza: la regla A3 de la web). */
const DIA = 86400000;

  c.fillStyle = '#5A566E'; c.font = '500 24px ' + BODY; c.fillText('Lo que sale en la web y los exámenes · ' + (agenda.semana + 1) + ' de ' + n, 120, 128);
  agenda.filas = [];
  for (let d = 0; d < 7; d++) {
    const f = new Date(lunes.getTime() + d * DIA), iso = isoDe(f), y0 = 170 + d * 104, items = AGENDA.filter(a => a[0] === iso);
    c.fillStyle = 'rgba(47,95,208,.16)'; c.fillRect(40, y0 + 100, w - 80, 2);

    items.slice(0, 2).forEach(([, t, url], k) => {

      c.fillStyle = conEnlace ? '#4638B8' : (iso < hoy ? '#8E8AA3' : '#1E1B2E');
      cabe(c, t + (conEnlace ? '  →' : ''), 230, y, w - 280, 36, '700', MANO);
      agenda.filas.push({ y0: y - 36, y1: y + 8, url: conEnlace ? url : '', t });
    });
    if (!items.length) { c.fillStyle = 'rgba(142,138,163,.5)'; c.font = '600 30px ' + MANO; c.fillText('—', 230, y0 + 62); }
  }
  c.fillStyle = '#8E8AA3'; c.font = '500 22px ' + BODY; c.textAlign = 'center';
  c.fillText((agenda.semana > 0 ? '← ' : '') + 'otra semana: flechas o clic en las esquinas' + (agenda.semana < n - 1 ? ' →' : ''), w / 2, h - 30); c.textAlign = 'left';
}
function agendaFila(uv) { if (!uv) return null; const y = (1 - uv.y) * hojaTex.userData.canvas.height; return agenda.filas.find(f => y >= f.y0 && y <= f.y1) || null; }
function agendaPasa(d) {

  agenda.semana = s; rePapel();
  const q0 = hojaPlano.quaternion.clone(); if (!reduced) anim(260, e => { hojaPlano.quaternion.copy(q0).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.sin(Math.PI * e) * 0.25 * -d, 0))); }, curva.suave);

// antes, y es también la LINTERNA del móvil. Es la misma luz (no se añade ninguna: cada luz cuesta en cada píxel)
const luzMano = new THREE.SpotLight(0xFFF1DE, 0, 7, 0.62, 0.55, 2); scene.add(luzMano); scene.add(luzMano.target);
let pickPar = 0;

  const cerca = ['inspeccion', 'lectura', 'carpeta', 'bot', 'papel'].includes(gesto.estado) || (gesto.estado === 'ocupado' && gesto.obj);
  luzMano.intensity = lerp(luzMano.intensity, linterna.on ? 5 : cerca ? 0.9 : 0, reduced ? 1 : 1 - Math.exp(-dt * 6));
  luzMano.position.copy(camera.position).add(v3(0.08, -0.06, 0.02).applyQuaternion(camera.quaternion));

  const leyendo = ahora < ledHasta;
  led.material.emissiveIntensity = reduced ? 1 : (leyendo ? (Math.sin(ahora / 60) > 0 ? 1.8 : 0.1) : 1.0 + Math.sin(ahora / 900) * 0.3);
  screenLight.intensity = $('#os').hidden ? (pantalla.estado === 'apagado' ? 0 : pantalla.estado === 'reposo' ? 1.2 : 2.0) : 0;
  powerBtn.material.emissiveIntensity = pantalla.estado === 'apagado' ? 0.3 : 1.0;

}
const fps = { cuenta: 0 };

/* ---------- ?fps: un panel pequeño con los números, para probar el rendimiento en un portátil (v0.2.3) ---------- */
let panelFps = PARAMS.has('fps') ? creaPanelFps() : null;
function alternaPanelFps() { if (panelFps) { panelFps.d.remove(); panelFps = null; } else panelFps = creaPanelFps(); }
function creaPanelFps() { return (() => { const d = document.createElement('div'); d.setAttribute('aria-hidden', 'true'); d.style.cssText = 'position:fixed;right:10px;top:10px;z-index:50;padding:8px 10px;border-radius:8px;background:rgba(20,18,33,.85);color:#E8E6F5;font:500 12px/1.5 "JetBrains Mono",monospace;font-variant-ligatures:none;pointer-events:none;white-space:pre'; document.body.appendChild(d); return { d, t0: 0, n0: 0 }; })(); }
function corrPanelFps(ahora) {
  if (ahora - panelFps.t0 < 500) return;
  const f = (fps.cuenta - panelFps.n0) / ((ahora - panelFps.t0) / 1000); panelFps.t0 = ahora; panelFps.n0 = fps.cuenta;
  const c = renderer.domElement;
  panelFps.d.textContent = f.toFixed(0) + ' fps · ' + (RES.ema * 1000).toFixed(1) + ' ms\n' + c.width + ' × ' + c.height + ' (' + (c.width * c.height / 1e6).toFixed(2) + ' Mpx)\nescala ' + Math.round(RES.escala * 100) + ' %' + (RES.fija ? ' (fija)' : '') + ' · ×' + renderer.getPixelRatio().toFixed(2) + '\n' + renderer.info.render.calls + ' llamadas · ' + (renderer.info.render.triangles / 1000).toFixed(1) + ' k tri' + (clics.length ? '\núltimo clic: ' + clics[clics.length - 1].que + ' (' + clics[clics.length - 1].ms + ' ms, ' + clics[clics.length - 1].px + ' px)' : '');
}

/* ---------- juntar lo quieto (v0.2.3, fallo 19) ----------
   Cada malla es una «llamada de dibujo» (draw call): la CPU prepara y envía cada una por separado. La v0.2.2 hacía
   274 sentado. Lo que nunca se mueve, no se toca y no tiene textura (paredes, patas, marcos, muebles…) se junta por
   material: todas las piezas con el mismo color y acabado pasan a ser UNA malla (mergeGeometries, en coordenadas del
   mundo). Solo entra lo que cuelga de la escena o de un grupo marcado como quieto (userData.quieto). */
function juntaQuietos() {
  scene.updateMatrixWorld(true);
  const grupos = new Map(), quitar = [];
  const quietoArriba = o => { for (let p = o.parent; p; p = p.parent) { if (p === scene) return true; if (!p.userData.quieto) return false; } return false; };
  scene.traverse(m => {
    if (!m.isMesh || m.userData.clave || m.userData.noJuntar || !quietoArriba(m)) return;
    const x = m.material;
    if (Array.isArray(x) || x.map || x.transparent || x.onBeforeCompile !== THREE.Material.prototype.onBeforeCompile || m.geometry.morphAttributes.position) return;
    if (x.emissive && (x.emissive.getHex() !== 0 && x.emissiveIntensity > 0)) return;     // lo que se enciende se queda aparte
    const k = [x.type, x.color.getHexString(), x.roughness, x.metalness, x.side, x.vertexColors].join('|');
    (grupos.get(k) || grupos.set(k, []).get(k)).push(m);
  });
  let antes = 0, despues = 0;
  grupos.forEach(lista => {
    if (lista.length < 2) return;
    const geos = lista.map(m => { let g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone(); g.applyMatrix4(m.matrixWorld); for (const a of Object.keys(g.attributes)) if (a !== 'position' && a !== 'normal') g.deleteAttribute(a); g.morphAttributes = {}; return g; });
    const g = mergeGeometries(geos); if (!g) return;
    const junta = new THREE.Mesh(g, lista[0].material); junta.name = 'quietos'; junta.userData.junta = lista.length; scene.add(junta);
    lista.forEach(m => { m.parent.remove(m); m.geometry.dispose(); }); antes += lista.length; despues++;
  });
  return { antes, despues };
}
/* ---------- precompilar los sombreadores (v0.2.3, fallo 19: los tirones «al hacer cualquier cosa») ----------
   WebGL compila un programa la primera vez que dibuja una combinación de material nueva (una página con textura, la
   hoja de la agenda, el libro abierto…). Eso congela un fotograma. Al cargar, se enseña todo un instante (también lo
   oculto) y se compila de una vez; el libro abierto y las hojas usan materiales del mismo tipo que se crean aquí. */
function precompila() {
  const ocultos = [];
  scene.traverse(o => { if (!o.visible) { ocultos.push(o); o.visible = true; } });
  const tex = texFrom(4, 4), extra = new THREE.Group(); scene.add(extra);
  [THREE.FrontSide, THREE.BackSide, THREE.DoubleSide].forEach(side => {
    extra.add(new THREE.Mesh(new THREE.PlaneGeometry(0.01, 0.01), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.92, side })));
    extra.add(new THREE.Mesh(new THREE.PlaneGeometry(0.01, 0.01), new THREE.MeshBasicMaterial({ map: tex, side, toneMapped: false })));
    extra.add(new THREE.Mesh(new THREE.PlaneGeometry(0.01, 0.01), new THREE.MeshLambertMaterial({ map: tex, side })));

  extra.position.set(0, -5, 0);
  try { renderer.compile(scene, camera); } catch (e) { /* si no se puede, se compilará al usarlo */ }
  ocultos.forEach(o => { o.visible = false; }); scene.remove(extra);
  return renderer.info.programs ? renderer.info.programs.length : 0;
}

/* ---------- para los guiones de grabar.js y las pruebas ---------- */
// __slPantalla(clave) → [x, y] de 0 a 1: dónde cae el centro del objeto en la pantalla
window.__slPantalla = clave => {
  let p = null;
  if (clave === 'disquetera') p = tray.getWorldPosition(new THREE.Vector3()).add(v3(0, 0, 0.05));
  else if (clave === 'puerto-usb') p = PUERTO.clone();
  else if (clave === 'pizarra-v' || clave === 'pizarra-f') { const [x, y, w, h] = clave === 'pizarra-v' ? CAJA_V : CAJA_F; p = enPizarra(x + w / 2, y + h / 2); }
  else if (clave === 'pagina-derecha' && lectura.rig) p = lectura.rig.pagDer.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(lectura.rig.W * 0.3, 0, 0).applyQuaternion(lectura.rig.rig.quaternion));
  else if (clave === 'pagina-izquierda' && lectura.rig) p = lectura.rig.pagIzq.getWorldPosition(new THREE.Vector3());
  else if (clave === 'mesa') p = v3(0.02, PLANO_Y, -0.08);

  else if (objetos.get(clave)) p = centroDe(objetos.get(clave));

window.__slEstado = () => gesto.estado;
// para las capturas: sin punto ni resaltado (__slFoto(true)) y la vista fija hacia un punto desde donde estés (__slMira)
let modoFoto = false;
window.__slFoto = (on = true) => { modoFoto = on; punto.el.style.visibility = on ? 'hidden' : ''; if (on) setHover(null); return on; };
window.__slMira = (x, y, z, fov = 62) => { enfoca(v3(x, y, z), ojos(), fov, { paralaje: 0, rate: 30 }); return true; };
window.__slHover = () => gesto.hover;
window.__slObj = k => objetos.get(k);
window.__slPos = clave => { const o = objetos.get(clave); if (!o || !o.raiz) return null; const p = o.raiz.getWorldPosition(new THREE.Vector3()); return [+p.x.toFixed(3), +p.y.toFixed(3), +p.z.toFixed(3), o.raiz.visible]; };
window.__slRumbo = r => { rig.rumbo = r; cam.yaw = r; };
window.__slFps = () => fps.cuenta;
window.__slVersion = VERSION;
window.__slClic = k => { const o = objetos.get(k); if (o) clicEn(o, null, null); return !!o; };
window.__slUsa = () => { if (insp.o) usa(insp.o); };
window.__slEsc = () => { const m = modos[gesto.estado]; if (m && m.esc) m.esc(); };
window.__slCam = () => [+cam.yaw.toFixed(3), +cam.pitch.toFixed(3), +cam.fov.toFixed(1)];
window.__slBloques = () => lectura.rig ? { izq: lectura.rig.bloqueIzq.visible, tIzq: +lectura.rig.bloqueIzq.scale.z.toFixed(4), hoja: lectura.rig.frente.visible } : null;
window.__slPagina = (p) => { if (!lectura.rig) return null; if (!lectura.giro) empiezaGiro(1, 0); lectura.giro.p = p; doblaHoja(p, 0); return __slBloques(); };
window.__slPonte = (x, z, yaw = 0, pitch = -0.08) => { jug.sentado = false; jug.en = null; jug.pos.set(x, DE_PIE, z); silla.position.z = sillaTapada.z; sillaGiro.rotation.y = 0; rig.foco = null; rig.rumbo = yaw; cam.yaw = yaw; cam.pitch = pitch; cam.pos.copy(jug.pos); return true; };
window.__slAnda = (...k) => { caminar.teclas = new Set(k); return k; };
window.__slTeclas = () => Object.keys(keyPress).map(i => TECLAS[i]);
window.__slPizarra = () => ({ nota: piz.nota ? piz.nota.txt : null, ops: pizOps.length, herramienta: piz.herramienta, grosor: piz.grosor, guardado: (guardado.get('pizarra', { ops: [] }).ops || []).length });

window.__slGiro = () => ({ x: +giro.x.toFixed(3), y: +giro.y.toFixed(3), wx: +giro.wx.toFixed(3), q: insp.q.toArray().map(v => +v.toFixed(3)) });
window.__slMonitor = () => pantalla.estado;
window.__slVapor = () => { const a = vapor.pos, n = vapor.N; let x = 0, y = 0, z = 0, ymin = 9; for (let i = 0; i < n; i++) { x += a[i * 3]; y += a[i * 3 + 1]; z += a[i * 3 + 2]; ymin = Math.min(ymin, a[i * 3 + 1]); } const b = tazaCuerpo.localToWorld(v3(0, 0.05, 0)); return { centro: [x / n, y / n, z / n].map(v => +v.toFixed(3)), ymin: +ymin.toFixed(3), boca: b.toArray().map(v => +v.toFixed(3)) }; };

window.__slTab = () => [...nav.querySelectorAll('button')].filter(b => !b.hidden).map(b => b.dataset.clave);
window.__slRes = () => ({ escala: +RES.escala.toFixed(2), ratio: +renderer.getPixelRatio().toFixed(3), cambios: RES.cambios, fija: RES.fija });
window.__slCuenta = (sinEspejo = true) => {   // las llamadas de un fotograma (sin el espejo, que dibuja el cuarto otra vez) y quién las hace
  const v = espejo.visible; if (sinEspejo) espejo.visible = false; renderer.render(scene, camera); const calls = renderer.info.render.calls; espejo.visible = v;
  const por = {}; scene.children.forEach(c => { let n = 0; c.traverseVisible(o => { if (o.isMesh || o.isPoints || o.isLine) n++; }); if (n) { const k = c.name || (c.isMesh ? 'malla suelta' : c.type); por[k] = (por[k] || 0) + n; } });

};
// v0.2.4: para probar el modo juego sin un ratón de verdad (el navegador sin ventana no captura el ratón): finge la captura
window.__slCaptura = (on = true) => { control.modo = 'juego'; control.bloqueado = on; document.body.classList.toggle('capturado', on); if (on) { rig.pj = cam.pitch; ndc.set(0, 0); ratonVisto = true; colocaPunto(innerWidth / 2, innerHeight / 2); } actualizaAvisoCaptura(); return control.bloqueado; };
window.__slApunta = k => { const o = objetos.get(k); if (!o) return null; const a = anglesTo(ojos(), centroDe(o)); rig.rumbo = a.yaw; rig.pj = a.pitch; cam.yaw = a.yaw; cam.pitch = a.pitch; necesitaPick = true; return [+a.yaw.toFixed(3), +a.pitch.toFixed(3)]; };
window.__slControl = () => ({ modo: control.modo, bloqueado: control.bloqueado, cursor: [Math.round(control.cursor.x), Math.round(control.cursor.y)], rumbo: +rig.rumbo.toFixed(3), pj: +(rig.pj ?? 0).toFixed(3), hover: gesto.hover, pl: PL_OK });
window.__slInsp = () => (insp.o ? insp.o.clave : null);
window.__slTorre = () => ({ disco: torre.disco ? torre.disco.clave : null, usb: torre.usb ? torre.usb.clave : null, bandeja: +torre.bandeja.toFixed(2) });

window.__slProgramas = () => renderer.info.programs ? renderer.info.programs.length : 0;
window.__slInfo = () => ({ llamadas: renderer.info.render.calls, triangulos: renderer.info.render.triangles, geometrias: renderer.info.memory.geometries, texturas: renderer.info.memory.textures, objetos: objetos.size });

const fuentes = document.fonts && document.fonts.load ? Promise.all(['600 40px "Space Grotesk"', '400 20px "JetBrains Mono"', '600 20px "JetBrains Mono"', '400 20px Inter', '700 40px Caveat', '500 30px Caveat'].map(f => document.fonts.load(f))) : Promise.resolve();
Promise.race([fuentes, new Promise(r => setTimeout(r, 2500))]).then(() => {

  dibujaBase(); repintaTrazos();

  cambia('libre');

});
