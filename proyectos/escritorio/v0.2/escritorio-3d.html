<style>
/* v0.2 · Una habitación de noche vista desde la silla. Fuera del PC no hay interfaz: solo el punto. */
:root{
  --ink:#1E1B2E; --ink-2:#2A2640; --ink-3:#141221; --line:#3A3552;
  --violet:#5B4BDB; --violet-l:#A99EF5; --coral:#FF6B4A; --coral-l:#FF9B80;
  --cream:#FAFAF7; --text:#E8E6F5; --muted:#C9C5DC; --ok:#5BD39A; --err:#FF8A7A; --amber:#F5C06B;
  --f-display:'Space Grotesk','Segoe UI',system-ui,sans-serif;
  --f-body:Inter,'Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink-3);color:var(--text);font-family:var(--f-body);overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none;outline:none}
code,.mono{font-family:var(--f-mono);font-variant-ligatures:none}
/* el punto (E03): cambia de forma según la acción */
#punto{position:fixed;left:0;top:0;z-index:9;pointer-events:none;width:0;height:0;transition:opacity .2s}
#punto .ico{position:absolute;left:-14px;top:-14px;width:28px;height:28px;display:grid;place-items:center;transition:transform .16s cubic-bezier(.2,.9,.3,1.3)}
#punto svg{width:24px;height:24px;overflow:visible}
#punto .dot{width:7px;height:7px;border-radius:50%;background:var(--cream);box-shadow:0 0 0 2px rgba(20,18,33,.55)}
#punto .nombre{position:absolute;left:18px;top:10px;white-space:nowrap;font:500 12px/1 var(--f-body);color:var(--cream);text-shadow:0 1px 3px rgba(0,0,0,.8);opacity:0;transform:translateY(3px);transition:opacity .25s,transform .25s}
#punto.con-nombre .nombre{opacity:.92;transform:none}
#punto.oculto{opacity:0}
/* velo de inspección: la habitación se oscurece alrededor del objeto */
#velo{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(20,18,33,0) 30%,rgba(20,18,33,.72) 100%);opacity:0;transition:opacity .45s}
#velo.on{opacity:1}
/* recordatorio de teclas, solo las dos primeras veces que se inspecciona */
#teclas{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;display:flex;gap:18px;font:500 13px var(--f-body);color:var(--muted);opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#teclas.on{opacity:1}
#teclas kbd{display:inline-block;min-width:24px;padding:2px 7px;margin-right:6px;border:1px solid rgba(201,197,220,.5);border-bottom-width:2px;border-radius:6px;font:600 12px var(--f-mono);font-variant-ligatures:none;color:var(--cream);text-align:center}
/* accesibilidad (E20): invisible hasta que se usa el teclado */
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#saltar{position:fixed;left:16px;top:16px;z-index:40;padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--text);font:500 14px var(--f-body);box-shadow:0 0 0 2px var(--coral);text-decoration:none;transform:translateY(-200%)}
#saltar:focus{transform:none;outline:none}
#objetos button{all:unset}
#etiqueta{position:fixed;z-index:8;pointer-events:none;transform:translate(-50%,-140%);padding:6px 10px;border-radius:8px;background:rgba(20,18,33,.86);box-shadow:0 0 0 2px var(--coral);font:500 13px var(--f-body);color:var(--cream);white-space:nowrap}
:focus-visible{outline:2px solid var(--coral);outline-offset:3px}
#entrada{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
#carga{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--ink-3);font:500 15px var(--f-body);color:var(--muted);transition:opacity .6s}
#carga.fuera{opacity:0;pointer-events:none}
#sin3d{position:fixed;inset:0;z-index:31;display:grid;place-items:center;padding:24px;background:var(--ink);font:400 15px/1.7 var(--f-body)}
#sin3d a{color:var(--violet-l)}
/* SergioLearns OS (mundo virtual: aquí sí hay terminal). Se rehace en la v0.3 */
#os{position:fixed;inset:0;z-index:20;background:var(--ink-3);overflow:hidden;transform-origin:50% 50%;cursor:default}
#os.on{animation:crtOn .55s cubic-bezier(.2,.8,.2,1)}
#os.off{animation:crtOff .45s ease-in forwards}
@keyframes crtOn{0%{transform:scale(1,.004);filter:brightness(3)}45%{transform:scale(1,.004)}100%{transform:scale(1,1);filter:brightness(1)}}
@keyframes crtOff{0%{transform:scale(1,1)}55%{transform:scale(1,.004);filter:brightness(2.5)}100%{transform:scale(0,.004);filter:brightness(4)}}
#wall{position:absolute;inset:0;width:100%;height:100%}
.os-bar{position:absolute;left:0;right:0;top:0;height:44px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(20,18,33,.9);border-bottom:1px solid var(--line);font:600 13px var(--f-mono);font-variant-ligatures:none}
.os-bar .clock{color:var(--muted);font-weight:400}
.dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(20,18,33,.9);border:1px solid var(--line);border-radius:20px;padding:8px 10px;max-width:calc(100vw - 32px);overflow-x:auto}
.dock button{background:none;border:1px solid transparent;border-radius:14px;padding:8px 10px;min-width:70px;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:var(--text);font:500 11px var(--f-mono);font-variant-ligatures:none;transition:transform .18s cubic-bezier(.2,.9,.3,1.3)}
.dock button:hover,.dock button:focus-visible{transform:translateY(-6px) scale(1.12);border-color:var(--coral)}
.dock svg{width:26px;height:26px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.win{position:absolute;width:min(640px,calc(100vw - 32px));background:var(--ink-2);border-radius:14px;box-shadow:0 0 0 1px rgba(255,107,74,.45),0 24px 60px rgba(0,0,0,.5);overflow:hidden;animation:winIn .3s cubic-bezier(.2,.9,.3,1.15)}
@keyframes winIn{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
.win-bar{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;background:var(--ink);cursor:grab;font:600 13px var(--f-mono);font-variant-ligatures:none;touch-action:none;user-select:none}
.win-bar button{background:none;border:0;cursor:pointer;color:var(--muted);padding:6px 10px;min-height:32px;font:600 12px var(--f-mono)}
.win-bar button:hover{color:var(--coral-l)}
.win-body{padding:16px 18px;font:400 14px/1.65 var(--f-mono);font-variant-ligatures:none;max-height:min(56vh,460px);overflow:auto;white-space:normal}
.win-body a{color:var(--violet-l)}
.win-body pre{margin:0;white-space:pre-wrap;font:inherit}
.term-line{white-space:pre-wrap}
.term-in{display:flex;gap:8px;align-items:center;margin-top:6px}
.term-in label{color:var(--violet-l);white-space:nowrap}
.term-in input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font:400 14px var(--f-mono);font-variant-ligatures:none;caret-color:var(--coral)}
.c-ok{color:var(--ok)}.c-err{color:var(--err)}.c-cmd{color:var(--violet-l)}.c-dim{color:var(--muted)}.c-num{color:var(--amber)}.c-co{color:var(--coral)}
.dollar{color:var(--coral)}
@media (prefers-reduced-motion: reduce){
  #os.on,#os.off,.win{animation:none}
  .dock button,#punto .ico,#velo,#teclas{transition:none}
}

<script type="module">
/* ===================== 01 · núcleo =====================
   Motor (three.js como módulo), utilidades de geometría y texturas,
   animaciones (curvas, anim() con promesas y muelles) y el «bus» de eventos
   con el que se avisan los módulos entre sí. */
import * as THREE from 'three';

const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const $ = s => document.querySelector(s);
const VERSION = 'v0.2';

/* ---------- bus: los módulos se avisan sin conocerse ---------- */
const bus = {
  oy: {},
  on(ev, fn) { (this.oy[ev] = this.oy[ev] || []).push(fn); },
  emit(ev, dato) { (this.oy[ev] || []).forEach(fn => fn(dato)); }
};

/* ---------- guardado por persona (solo comodidades: puede fallar) ---------- */
const guardado = {
  get(k, def) { try { const v = localStorage.getItem('sl-escritorio-' + k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem('sl-escritorio-' + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento: no pasa nada */ } }
};

/* ---------- WebGL ---------- */
const canvas = $('#gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer || !renderer.getContext()) {
  const fb = $('#sin3d');
  fb.innerHTML = '<div><p>Este navegador no puede dibujar la habitación en 3D (WebGL).</p>' +
    '<p>Todo lo que hay en ella está también en la web: <a href="https://sergiolearns.com/aprende/">Aprende</a> · <a href="https://sergiolearns.com/laboratorio/">Laboratorio</a> · <a href="https://sergiolearns.com/universidad/">Universidad</a></p></div>';
  fb.hidden = false; $('#carga').hidden = true;
  throw new Error('sin WebGL');
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141221);
scene.fog = new THREE.Fog(0x141221, 3.4, 6.5);
const camera = new THREE.PerspectiveCamera(62, 1, 0.02, 20);
const BASE = new THREE.Vector3(0, 1.22, 0.55);   // los ojos de alguien sentado
const MESA_Y = 0.74, PLANO_Y = 0.765;            // tablero de la mesa y plano de trabajo para arrastrar

/* ---------- geometría ---------- */
function mat(color, o = {}) {
  return new THREE.MeshStandardMaterial({
    color, roughness: o.r ?? 0.82, metalness: o.m ?? 0.04,
    emissive: o.e ?? 0x000000, emissiveIntensity: o.ei ?? 0, map: o.map ?? null,
    transparent: !!o.t, opacity: o.op ?? 1, side: o.side ?? THREE.FrontSide
  });
}
function box(w, h, d, m, x = 0, y = 0, z = 0, padre = scene) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y, z); padre.add(mesh); return mesh;
}
function cyl(rt, rb, h, m, x = 0, y = 0, z = 0, padre = scene, seg = 32) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  mesh.position.set(x, y, z); padre.add(mesh); return mesh;
}
function plano(w, h, m, x = 0, y = 0, z = 0, rx = 0, ry = 0, padre = scene) {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
  p.position.set(x, y, z); p.rotation.set(rx, ry, 0); padre.add(p); return p;
}

/* ---------- texturas dibujadas en un lienzo ---------- */
const MONO = '"JetBrains Mono", ui-monospace, Consolas, monospace';
const DISP = '"Space Grotesk", "Segoe UI", sans-serif';
const BODY = 'Inter, "Segoe UI", sans-serif';
const MANO = 'Caveat, "Segoe Print", cursive';   // la letra a mano (pizarra, etiquetas de los discos)
const TEXTURAS = [];   // las que se redibujan cuando cargan las fuentes
function texFrom(w, h, dibuja) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); if (dibuja) dibuja(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.userData = { canvas: c, g, dibuja };
  if (dibuja) TEXTURAS.push(t);
  return t;
}
function redibuja(t, dibuja) { const { canvas: c, g } = t.userData; g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height); g.restore(); (dibuja || t.userData.dibuja)(g, c.width, c.height); t.needsUpdate = true; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function wrap(g, texto, x, y, maxW, lh) {
  const palabras = texto.split(' '); let linea = '';
  for (const p of palabras) {
    const t = linea ? linea + ' ' + p : p;
    if (g.measureText(t).width > maxW && linea) { g.fillText(linea, x, y); linea = p; y += lh; } else linea = t;
  }
  if (linea) g.fillText(linea, x, y);
  return y;
}

/* ---------- animaciones ---------- */
// Curvas: reciben el avance x (0 → 1) y devuelven cuánto se ha movido (puede pasar de 1 en las que rebotan)
const curva = {
  lineal: x => x,
  suave: x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),   // cúbica de entrada y salida (la de la v0.1)
  sale: x => 1 - Math.pow(1 - x, 3),                                        // frena al final
  entra: x => x * x * x,                                                     // arranca despacio
  retroceso: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }, // se pasa y vuelve
  rebote: x => {                                                             // cae y rebota (disco en la bandeja)
    const n = 7.5625, d = 2.75;
    if (x < 1 / d) return n * x * x;
    if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75;
    if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375;
    return n * (x -= 2.625 / d) * x + 0.984375;
  }
};
const anims = [];
// anim(duración en ms, función que recibe el avance ya curvado, curva) → promesa que se cumple al terminar
function anim(dur, fn, ease = curva.suave) {
  return new Promise(resolve => {
    const a = { t0: performance.now(), dur: reduced ? Math.min(dur, 1) : dur, fn, ease, resolve, vivo: true };
    anims.push(a);
  });
}
function espera(ms) { return anim(reduced ? 0 : ms, () => {}); }
function corrAnims(ahora) {
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i], p = Math.min(1, (ahora - a.t0) / a.dur);
    a.fn(a.ease(p), p);
    if (p >= 1) { anims.splice(i, 1); a.resolve(); }
  }
}
// Muelle amortiguado: da «peso» (cajón, objeto que se lleva). F = −k·(x − objetivo) − c·v
class Muelle {
  constructor(x = 0, k = 120, c = 16, m = 1) { this.x = x; this.v = 0; this.obj = x; this.k = k; this.c = c; this.m = m; }
  paso(dt) {
    if (reduced) { this.x = this.obj; this.v = 0; return this.x; }
    const sub = Math.ceil(dt / 0.008), h = dt / sub;          // pasos pequeños para que no se vuelva inestable
    for (let i = 0; i < sub; i++) {
      const a = (-this.k * (this.x - this.obj) - this.c * this.v) / this.m;
      this.v += a * h; this.x += this.v * h;                  // Euler semiimplícito: primero la velocidad
    }
    return this.x;
  }
  quieto() { return Math.abs(this.x - this.obj) < 1e-4 && Math.abs(this.v) < 1e-3; }
}
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

/* ===================== 02 · datos =====================
   Lo que hay en la habitación, con datos reales de la web (4 nov 2026).
   Regla de Sergio (4 nov): fuera del PC todo es físico, sin órdenes de terminal. */

  const N = 90, pos = new Float32Array(N * 3), sem = [];
  for (let i = 0; i < N; i++) { sem.push([Math.random(), Math.random(), Math.random(), 0.3 + Math.random()]); }

  const p = new THREE.Points(g, m); scene.add(p);
  return { p, pos, sem, N };
})();
function corrPolvo(t, encendida) {
  polvo.p.visible = encendida; if (!encendida) return;
  const { pos, sem, N } = polvo, s = reduced ? 0 : t / 1000;
  for (let i = 0; i < N; i++) {
    const [a, b, c, v] = sem[i];
    const y = 0.78 + ((b + s * 0.012 * v) % 1) * 0.3;           // sube despacio y vuelve a empezar
    const r = 0.03 + (1.1 - y) * 0.4 * a;                         // el cono se abre hacia abajo
    const ang = c * Math.PI * 2 + s * 0.15 * v;
    pos[i * 3] = -0.42 + Math.cos(ang) * r; pos[i * 3 + 1] = y; pos[i * 3 + 2] = -0.58 + Math.sin(ang) * r;
  }
  polvo.p.geometry.attributes.position.needsUpdate = true;
}

   en un sitio (la pizarra, el libro abierto, el monitor). */
const cam = { pos: BASE.clone(), yaw: 0, pitch: -0.12, fov: 62 };
const rig = { rumbo: 0, mx: 0, my: 0, foco: null, teclaGiro: 0, sensib: 1, bordeListo: false };

function anglesTo(from, to) { const d = to.clone().sub(from); return { yaw: Math.atan2(-d.x, -d.z), pitch: Math.asin(d.y / d.length()) }; }
function enfoca(punto, desde = BASE, fov = 50, extra = {}) {
  const a = anglesTo(desde, punto);

  let yaw = a.yaw; while (yaw - cam.yaw > Math.PI) yaw -= 2 * Math.PI; while (yaw - cam.yaw < -Math.PI) yaw += 2 * Math.PI;
  rig.foco = Object.assign({ yaw, pitch: a.pitch, pos: desde.clone(), fov }, extra);
}
function sueltaFoco() {
  // al soltar el foco, el rumbo pasa a ser el giro actual menos la mirada, para que no haya salto
  if (rig.foco) rig.rumbo = cam.yaw + rig.mx * 1.05;
  rig.foco = null;
}
function rumboACero() {
  // Esc en LIBRE: vuelve a mirar a la mesa por el camino corto
  const n = Math.round(rig.rumbo / (2 * Math.PI)) * 2 * Math.PI;
  rig.rumbo -= n; cam.yaw -= n;

}
function aplicaCamara(dt) {
  let ty, tp, tpos, tfov;

  else {
    // el borde gira solo cuando no se está haciendo otra cosa con el ratón
    // solo si el ratón ha entrado en el borde estando libre (si acabas de soltar un disco junto al borde, no gira solo)
    if (Math.abs(rig.mx) <= BORDE) rig.bordeListo = gesto.estado === 'libre';
    const puedeGirar = rig.bordeListo && gesto.estado === 'libre' && !gesto.pulsado && !teclado.activo;
    if (puedeGirar && Math.abs(rig.mx) > BORDE) rig.rumbo -= Math.sign(rig.mx) * VEL_BORDE * ((Math.abs(rig.mx) - BORDE) / (1 - BORDE)) * dt;
    rig.rumbo -= rig.teclaGiro * VEL_TECLA * dt;
    ty = rig.rumbo - rig.mx * 1.05 * rig.sensib;
    tp = rig.my > 0 ? -0.12 + rig.my * 0.75 : -0.12 + rig.my * 0.85;
    tpos = BASE; tfov = 62;
  }
  const rate = f && f.rate ? f.rate : 5;
  const k = reduced ? 1 : 1 - Math.exp(-dt * rate);      // suavizado exponencial: igual de suave a 30 o a 144 fps
  cam.yaw += (ty - cam.yaw) * k; cam.pitch += (tp - cam.pitch) * k; cam.fov += (tfov - cam.fov) * k; cam.pos.lerp(tpos, k);
  const respira = reduced || f ? 0 : Math.sin(performance.now() / 1400) * 0.004;
  camera.position.set(cam.pos.x, cam.pos.y + respira, cam.pos.z);
  const cp = Math.cos(cam.pitch);
  camera.lookAt(cam.pos.x - Math.sin(cam.yaw) * cp, cam.pos.y + respira + Math.sin(cam.pitch), cam.pos.z - Math.cos(cam.yaw) * cp);
  if (Math.abs(camera.fov - cam.fov) > 0.01) { camera.fov = cam.fov; camera.updateProjectionMatrix(); }
}

/* ===================== 06 · gestos =====================
   El sistema que usan todos los objetos (diagrama: material/v0.2/bocetos/02):
   LIBRE → ENCIMA → PULSADO → (clic) INSPECCIÓN → E: USAR · Esc: vuelve a su sitio
                            → (arrastre) LLEVAR → zona cerca: brilla → soltar: ENCAJA
   Cada modo especial (libro abierto, pizarra, taza…) se registra con modo(). */
const gesto = { estado: 'cargando', pulsado: null, hover: null, obj: null, arrastre: null };
const modos = {};
function modo(nombre, h) { modos[nombre] = h; }
function cambia(estado) { gesto.estado = estado; rig.bordeListo = false; bus.emit('estado', estado); actualizaPunto(); }
const teclado = { activo: false };   // se usa el teclado (Tab) en vez del ratón

/* ---------- el punto (E03) ---------- */
const ICO = {
  mano: 'M8 13V6.5a1.5 1.5 0 0 1 3 0V11 M11 10.5V4.5a1.5 1.5 0 0 1 3 0V11 M14 10.5V5.5a1.5 1.5 0 0 1 3 0V12 M17 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.6-2.2L5 15.5a1.6 1.6 0 0 1 2.4-2.1L8 14',
  agarre: 'M7 11V9.5a1.5 1.5 0 0 1 3 0 M10 10V8.5a1.5 1.5 0 0 1 3 0V10 M13 10V9a1.5 1.5 0 0 1 3 0v1 M16 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6v-3.5a1.5 1.5 0 0 1 3 0',
  girar: 'M20 12a8 8 0 1 1-2.3-5.7 M20 4v4h-4',
  rotulador: 'M15 4l5 5-10 10H5v-5z M13 6l5 5',
  borrador: 'M4 16l8-8 6 6-6 6H8z M12 20h8',
  pagina: 'M14 6l-6 6 6 6',
  enlace: 'M14 4h6v6 M20 4l-9 9 M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5'
};
const punto = { el: $('#punto'), forma: '', nombre: '', x: -100, y: -100 };
function setPunto(forma, nombre = '') {
  if (forma !== punto.forma) {
    punto.forma = forma;
    const ico = punto.el.querySelector('.ico');
    ico.innerHTML = forma === 'punto' || !ICO[forma] ? '<div class="dot"></div>' :
      '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="' + ICO[forma] + '" stroke="#141221" stroke-width="4"/><path d="' + ICO[forma] + '" stroke="#FAFAF7" stroke-width="1.8"/></svg>';
    ico.style.transform = 'scale(.6)'; requestAnimationFrame(() => { ico.style.transform = ''; });
  }
  if (nombre !== punto.nombre) { punto.nombre = nombre; if (nombre) punto.el.querySelector('.nombre').textContent = nombre; }
  punto.el.classList.toggle('con-nombre', !!nombre);
}
function actualizaPunto() {
  const s = gesto.estado, m = modos[s];
  if (m && m.punto) { const r = m.punto(); setPunto(r[0], r[1] || ''); return; }
  if (s === 'llevar') return setPunto('agarre');
  if (s === 'inspeccion') return setPunto(gesto.arrastre ? 'agarre' : 'girar');
  if (s === 'libre' && gesto.hover) { const o = objetos.get(gesto.hover); return setPunto(o.puntero || 'mano', o.nombre); }
  setPunto('punto');
}

/* ---------- rayo: qué hay debajo del puntero ---------- */
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(lista = pickables) {
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(lista, false);
  for (const h of hits) { const k = h.object.userData.clave, o = k && objetos.get(k); if (o && o.activo()) return { o, hit: h }; }
  return null;
}
function setHover(clave) {
  if (gesto.hover === clave) return;
  if (gesto.hover && objetos.get(gesto.hover)) brillo(objetos.get(gesto.hover).mallas, 0);
  gesto.hover = clave;
  if (clave) brillo(objetos.get(clave).mallas, objetos.get(clave).brilloK ?? 1);
  bus.emit('hover', clave);
  actualizaPunto();
}

/* ---------- puntero ---------- */
let necesitaPick = false, ultimoPuntero = { x: 0, y: 0 }, ratonVisto = false;
function aNdc(e) { ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); }
canvas.addEventListener('pointermove', e => {
  aNdc(e); necesitaPick = true; ratonVisto = true; teclado.activo = false; punto.el.classList.remove('oculto');
  punto.x = e.clientX; punto.y = e.clientY; punto.el.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
  if (e.pointerType === 'mouse' || gesto.pulsado == null) { rig.mx = ndc.x; rig.my = ndc.y; }
  else if (gesto.estado === 'libre' && gesto.pulsado && !gesto.pulsado.o) {      // táctil: arrastrar en vacío mira
    rig.rumbo -= (e.clientX - ultimoPuntero.x) * 0.004; rig.my = clamp(rig.my - (e.clientY - ultimoPuntero.y) * 0.004, -1, 1);
  }
  ultimoPuntero = { x: e.clientX, y: e.clientY };
  const m = modos[gesto.estado]; if (m && m.move) return m.move(e);
  const p = gesto.pulsado;
  if (p && p.o && Math.hypot(e.clientX - p.x, e.clientY - p.y) > 6) {
    gesto.pulsado = null;
    if (p.o.movil) empiezaLlevar(p.o, p.hit);
    else if (p.o.alArrastrar) { p.o.alArrastrar.empieza(p, e); gesto.arrastre = p.o; }
  }
  if (gesto.arrastre && gesto.arrastre.alArrastrar) gesto.arrastre.alArrastrar.mueve(e);
});
canvas.addEventListener('pointerdown', e => {
  aNdc(e); canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
  ultimoPuntero = { x: e.clientX, y: e.clientY };
  const m = modos[gesto.estado]; if (m && m.down) return m.down(e);
  if (gesto.estado !== 'libre') return;
  const r = pick();
  gesto.pulsado = { x: e.clientX, y: e.clientY, o: r && r.o, hit: r && r.hit };
});
canvas.addEventListener('pointerup', e => {
  aNdc(e);
  const m = modos[gesto.estado]; if (m && m.up) return m.up(e);
  if (gesto.arrastre) { const o = gesto.arrastre; gesto.arrastre = null; o.alArrastrar.suelta(e); return; }
  const p = gesto.pulsado; gesto.pulsado = null;
  if (p && p.o && gesto.estado === 'libre') clicEn(p.o, p.hit, e);
});
canvas.addEventListener('pointerleave', () => { if (gesto.estado === 'libre') setHover(null); punto.el.classList.add('oculto'); });
canvas.addEventListener('wheel', e => { const m = modos[gesto.estado]; if (m && m.wheel) { e.preventDefault(); m.wheel(e); } }, { passive: false });
function clicEn(o, hit, e) {
  if (o.alClic) return o.alClic(o, hit, e);
  if (o.movil || o.tipo === 'libro') return inspecciona(o);
}

/* ---------- INSPECCIÓN: el objeto en la mano (E03 · decisión de Sergio del 4 nov) ---------- */
const insp = { o: null, q: new THREE.Quaternion(), dist: 0.4, llegando: false };
const _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _v = new THREE.Vector3(), _e = new THREE.Euler();
function poseInspeccion(o, salidaPos, salidaQuat) {
  // delante de la cámara, a «dist» metros; orientado según su «insp.rot» y lo que lo haya girado la persona
  camera.getWorldDirection(_v);
  salidaPos.copy(camera.position).addScaledVector(_v, insp.dist);
  _q2.setFromEuler(o.insp.rot);
  salidaQuat.copy(camera.quaternion).multiply(insp.q).multiply(_q2);
}
async function inspecciona(o) {
  if (gesto.estado !== 'libre') return;
  setHover(null); cambia('ocupado');
  enfoca(camera.position.clone().add(camera.getWorldDirection(new THREE.Vector3())), camera.position.clone(), cam.fov, { paralaje: 0 });
  insp.o = o; insp.q.identity(); insp.dist = o.insp.dist; gesto.obj = o;
  bus.emit('coge', o);
  scene.attach(o.raiz);
  $('#velo').classList.add('on');
  const p0 = o.raiz.position.clone(), q0 = o.raiz.quaternion.clone(), p1 = new THREE.Vector3(), q1 = new THREE.Quaternion();
  // sale de su sitio (un poco hacia la silla) y vuela a la mano
  const salida = p0.clone().add(new THREE.Vector3(0, 0.03, 0.06));
  await anim(180, e => o.raiz.position.lerpVectors(p0, salida, e), curva.sale);
  await anim(560, e => { poseInspeccion(o, p1, q1); o.raiz.position.lerpVectors(salida, p1, e); o.raiz.quaternion.slerpQuaternions(q0, q1, e); }, curva.suave);
  cambia('inspeccion'); recordatorioTeclas();
  anuncia(o.nombre + ' en la mano. Arrastra o usa las flechas para girarlo, E para usarlo, Esc para dejarlo.');
}
function corrInspeccion(dt) {
  if (gesto.estado !== 'inspeccion' || !insp.o) return;
  const p1 = new THREE.Vector3(), q1 = new THREE.Quaternion();
  poseInspeccion(insp.o, p1, q1);
  const k = reduced ? 1 : 1 - Math.exp(-dt * 14);
  insp.o.raiz.position.lerp(p1, k); insp.o.raiz.quaternion.slerp(q1, k);
}
function giraInspeccion(dx, dy) {
  // girar en el espacio de la cámara: arrastrar a la derecha gira sobre el eje vertical de la pantalla
  _q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx); insp.q.premultiply(_q);
  _q.setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy); insp.q.premultiply(_q);
}
modo('inspeccion', {
  down(e) { gesto.arrastre = { x: e.clientX, y: e.clientY, movido: 0 }; actualizaPunto(); },
  move(e) {
    const a = gesto.arrastre; if (!a) return;
    giraInspeccion((e.clientX - a.x) * 0.012, (e.clientY - a.y) * 0.012);
    a.movido += Math.abs(e.clientX - a.x) + Math.abs(e.clientY - a.y); a.x = e.clientX; a.y = e.clientY;
  },
  up() { gesto.arrastre = null; actualizaPunto(); },
  wheel(e) { insp.dist = clamp(insp.dist + Math.sign(e.deltaY) * 0.03, insp.o.insp.dist * 0.55, insp.o.insp.dist * 1.5); },
  tecla(e) {
    const k = e.key;
    if (k === 'ArrowLeft') giraInspeccion(-0.2, 0); else if (k === 'ArrowRight') giraInspeccion(0.2, 0);
    else if (k === 'ArrowUp') giraInspeccion(0, -0.2); else if (k === 'ArrowDown') giraInspeccion(0, 0.2);
    else if (k === '+') insp.dist = Math.max(insp.o.insp.dist * 0.55, insp.dist - 0.03);
    else if (k === '-') insp.dist = Math.min(insp.o.insp.dist * 1.5, insp.dist + 0.03);
    else if (k === 'e' || k === 'E' || k === 'Enter') usa(insp.o);
    else return false;
    return true;
  },
  esc() { dejaInspeccion(); }
});
async function dejaInspeccion() {
  const o = insp.o; if (!o) return;
  cambia('ocupado'); $('#velo').classList.remove('on'); ocultaTeclas();
  await volverACasa(o);
  insp.o = null; gesto.obj = null; sueltaFoco(); cambia('libre'); bus.emit('vuelve');
}
function usa(o) {
  const fn = o.alUsar || USOS[o.tipo];
  if (!fn) return;
  $('#velo').classList.remove('on'); ocultaTeclas();
  insp.o = null;
  fn(o);
}
const USOS = {};   // tipo → qué hace E (los rellena el módulo 07)
async function volverACasa(o, dur = 620) {
  const c = o.casa, p0 = o.raiz.position.clone(), q0 = o.raiz.quaternion.clone();
  // destino en coordenadas del mundo (el padre puede ser el cajón, que se mueve)
  c.padre.updateMatrixWorld(true);
  const pW = c.pos.clone().applyMatrix4(c.padre.matrixWorld);
  const qW = c.padre.getWorldQuaternion(new THREE.Quaternion()).multiply(c.quat);
  const arriba = pW.clone().add(new THREE.Vector3(0, 0.05, 0.05));
  await anim(dur, e => { o.raiz.position.lerpVectors(p0, arriba, e); o.raiz.quaternion.slerpQuaternions(q0, qW, e); }, curva.suave);
  await anim(200, e => o.raiz.position.lerpVectors(arriba, pW, e), curva.sale);
  c.padre.attach(o.raiz); o.raiz.position.copy(c.pos); o.raiz.quaternion.copy(c.quat);
  bus.emit('deja', o);
}
let teclasVistas = guardado.get('teclas', 0);
function recordatorioTeclas() {
  if (teclasVistas >= 2) return;
  teclasVistas++; guardado.set('teclas', teclasVistas);
  const t = $('#teclas'); t.innerHTML = '<span><kbd>E</kbd>usar</span><span><kbd>Esc</kbd>dejar</span><span>arrastra para girarlo</span>'; t.classList.add('on');
}
function ocultaTeclas() { $('#teclas').classList.remove('on'); }

/* ---------- LLEVAR y ZONAS de destino (E05, E24) ---------- */
const zonas = [];
function zona(z) { z.prox = 0; z.activa = false; zonas.push(z); return z; }
const llevar = { o: null, obj: new THREE.Vector3(), prev: new THREE.Vector3(), vel: new THREE.Vector3(), zona: null, q: new THREE.Quaternion() };
const planoTrabajo = new THREE.Plane(new THREE.Vector3(0, 1, 0), -PLANO_Y);
function empiezaLlevar(o, hit) {
  setHover(null); cambia('llevar'); gesto.obj = o; llevar.o = o;
  bus.emit('coge', o);
  scene.attach(o.raiz);
  llevar.obj.copy(o.raiz.position); llevar.prev.copy(o.raiz.position); llevar.vel.set(0, 0, 0);
  llevar.q.copy(o.raiz.quaternion);
  rig.sensib = 0.45;   // mientras llevas algo, la cámara gira menos con el ratón
  anuncia('Llevas ' + o.nombre + '. Suéltalo donde brille.');
}
const _hitP = new THREE.Vector3();
const QLLEVAR = { disco: new THREE.Quaternion().setFromEuler(new THREE.Euler(0.85, 0, 0)),   // el disco se lleva inclinado hacia ti: se ve su etiqueta
  usb: new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI / 2, Math.PI, 0)), carpeta: new THREE.Quaternion(), taza: null };
function corrLlevar(dt) {
  const o = llevar.o; if (gesto.estado !== 'llevar' || !o) return;
  raycaster.setFromCamera(ndc, camera);
  const alturaBase = PLANO_Y + (o.tipo === 'taza' ? 0.06 : o.tipo === 'disco' ? 0.08 : 0.04);
  planoTrabajo.constant = -alturaBase;
  if (raycaster.ray.intersectPlane(planoTrabajo, _hitP)) {
    // límites: encima de la mesa y siempre delante de la torre y del monitor (si no, el objeto se esconde detrás)
    _hitP.x = clamp(_hitP.x, -0.85, 0.7); _hitP.z = clamp(_hitP.z, -0.5, 0.0);
    // la zona más cercana que acepte este objeto
    let mejor = null;
    for (const z of zonas) {
      if (!z.acepta(o)) { z.prox = 0; continue; }
      if (z.prox_) { z.prox = z.prox_(_hitP); }
      else {
        // cerca = cerca EN LA PANTALLA: se compara dónde apunta el ratón con dónde se ve la zona
        _v.copy(z.punto).project(camera);
        const d = Math.hypot((ndc.x - _v.x) * camera.aspect, ndc.y - _v.y);
        z.prox = _v.z < 1 ? clamp(1 - d / z.radio, 0, 1) : 0;
      }
      if (z.prox > 0 && (!mejor || z.prox > mejor.prox)) mejor = z;
    }
    zonas.forEach(z => {
      const activa = z === mejor;
      if (activa && !z.activa) { z.activa = true; z.alEntrar && z.alEntrar(o); }
      if (!activa && z.activa) { z.activa = false; z.alSalir && z.alSalir(o); }
      brillo(z.mallas, activa ? 1.4 + 2.4 * z.prox + Math.sin(performance.now() / 120) * 0.4 : 0);
    });
    llevar.zona = mejor;
    // cerca de la zona, el objeto sube hacia ella y se orienta como encajará
    const s = mejor ? curva.suave(mejor.prox) : 0;
    llevar.obj.set(lerp(_hitP.x, mejor ? mejor.punto.x : _hitP.x, s), lerp(alturaBase, mejor ? mejor.punto.y : alturaBase, s), lerp(_hitP.z, mejor ? mejor.punto.z : _hitP.z, s));
  }
  const k = reduced ? 1 : 1 - Math.exp(-dt * 16);
  o.raiz.position.lerp(llevar.obj, k);
  // inclinación según la velocidad: el objeto «cuelga» un poco al moverlo
  llevar.vel.subVectors(o.raiz.position, llevar.prev).divideScalar(Math.max(dt, 1e-3)); llevar.prev.copy(o.raiz.position);
  const qBase = QLLEVAR[o.tipo] || llevar.q;
  const qZona = llevar.zona && llevar.zona.quat ? llevar.zona.quat : qBase;
  _q.copy(qBase).slerp(qZona, llevar.zona ? curva.suave(llevar.zona.prox) : 0);
  _e.set(clamp(llevar.vel.z * 0.35, -0.35, 0.35), 0, clamp(-llevar.vel.x * 0.35, -0.35, 0.35));
  _q2.setFromEuler(_e); _q2.multiply(_q);

}
modo('llevar', {
  up() { sueltaLlevar(); },
  esc() { sueltaLlevar(true); }
});
async function sueltaLlevar(cancelar = false) {
  const o = llevar.o; if (!o) return;
  const z = cancelar ? null : llevar.zona;
  zonas.forEach(zz => { brillo(zz.mallas, 0); if (zz.activa && zz !== z) { zz.activa = false; zz.alSalir && zz.alSalir(o); } zz.activa = false; });
  llevar.o = null; llevar.zona = null; rig.sensib = 1; cambia('ocupado');
  if (z && z.prox > 0.12) { await z.encaja(o); return; }
  if (o.dejaDondeSea && !cancelar) {           // la taza se queda donde la sueltes
    const destino = o.raiz.position.clone(); destino.y = o.casa.pos.y;
    const p0 = o.raiz.position.clone(), q0 = o.raiz.quaternion.clone(), q1 = o.casa.quat.clone();
    await anim(260, e => { o.raiz.position.lerpVectors(p0, destino, e); o.raiz.quaternion.slerpQuaternions(q0, q1, e); }, curva.rebote);
    o.casa.pos.copy(destino); scene.attach(o.raiz); gesto.obj = null; cambia('libre'); bus.emit('deja', o); return;
  }
  await volverACasa(o, 520);

/* ===================== 08 · libro abierto =====================
   E06: hojas que se curvan al pasar, un bloque de páginas que adelgaza a la
   derecha y engorda a la izquierda, y la tapa debajo de las páginas leídas.
   Modelo y cuentas: material/v0.2/bocetos/04-libro-pagina-curva.svg
   Ejes del libro abierto: el lomo en el origen, las páginas hacia +x (derecha)
   o −x (izquierda) y la cara de lectura mirando a +z. */
const lectura = { o: null, rig: null, k: 0, K: 0, paginas: [], giro: null };
const SEG = 24, FILAS = 6, BETA = 0.9;

function paginasDe(b) {
  // Cada página es una función que dibuja en su lienzo. Todo físico: papel y tinta.
  const P = [];
  const papel = (c, w, h, n) => { c.fillStyle = '#FBF8EF'; c.fillRect(0, 0, w, h); c.fillStyle = 'rgba(0,0,0,.05)'; c.fillRect(0, 0, 18, h); c.fillStyle = '#8E8AA3'; c.font = '400 20px ' + BODY; c.textAlign = 'center'; c.fillText(String(n), w / 2, h - 30); c.textAlign = 'left'; };
  if (b.manual) {
    b.paginas.forEach(pg => P.push((c, w, h, n) => {
      papel(c, w, h, n);
      c.fillStyle = '#C93F22'; c.fillRect(48, 64, 60, 6);
      c.fillStyle = '#1E1B2E'; c.font = '600 40px ' + DISP; c.fillText(pg.t, 48, 120);
      c.fillStyle = '#1E1B2E'; c.font = '500 26px ' + BODY; pg.l.forEach((l, i) => c.fillText(l, 48, 180 + i * 38));
      if (pg.enlace) { c.fillStyle = '#4638B8'; c.fillRect(48, 180 + (pg.l.length - 1) * 38 + 8, c.measureText(pg.l[pg.l.length - 1]).width, 2); }
    }));
    P.enlaces = { [P.length - 1]: b.paginas[b.paginas.length - 1].enlace };
    return P;
  }
  P.push((c, w, h, n) => {
    papel(c, w, h, n);
    c.fillStyle = b.curso === 2 ? '#5A566E' : b.color; c.fillRect(48, 64, 80, 8);
    c.fillStyle = '#1E1B2E'; c.font = '600 96px ' + DISP; c.fillText(b.code, 48, 180);
    c.font = '500 30px ' + DISP; let y = wrap(c, b.sub, 48, 232, w - 96, 38);
    c.fillStyle = b.estado === 'Completa' ? '#16794B' : (b.estado === 'En curso' ? '#C2362B' : '#5A566E'); c.font = '600 26px ' + BODY; c.fillText(b.estado, 48, y + 64);
    c.fillStyle = '#1E1B2E'; c.font = '500 25px ' + BODY; b.datos.forEach((l, i) => c.fillText(l, 48, y + 120 + i * 38));
  });
  for (let i = 0; i < Math.max(1, b.temas.length); i += 8) {
    const parte = b.temas.slice(i, i + 8);
    P.push((c, w, h, n) => {
      papel(c, w, h, n);
      c.fillStyle = '#1E1B2E'; c.font = '600 36px ' + DISP; c.fillText(i ? 'Índice (sigue)' : 'Índice', 48, 110);
      c.font = '400 25px ' + BODY;
      if (!parte.length) { c.fillStyle = '#8E8AA3'; c.fillText('Páginas en blanco por ahora.', 48, 180); return; }
      parte.forEach((t, j) => { c.fillStyle = '#8E8AA3'; c.fillText(String(i + j + 1).padStart(2, '0'), 48, 180 + j * 44); c.fillStyle = '#2E2A42'; c.fillText(t, 100, 180 + j * 44); });
    });

  W.innerHTML = '<div class="win-bar"><span>' + titulo + '</span><button type="button" aria-label="Cerrar ' + titulo + '">cerrar</button></div><div class="win-body"></div>';
  const body = W.querySelector('.win-body');
  if (id === 'terminal') terminal(body);
  if (id === 'lab') body.innerHTML = SIMULADORES.map(d => '<div><a href="' + d.url + '" target="_blank" rel="noopener">' + d.nombre + '</a> <span class="c-dim">' + d.cmd + '</span></div>').join('') + '<div style="margin-top:10px"><a href="https://sergiolearns.com/laboratorio/" target="_blank" rel="noopener">Entornos</a> <span class="c-dim">Python, Java, C y MIPS en el navegador</span></div>';
  if (id === 'log') body.innerHTML = [['4 nov', 'escritorio v0.2: coger, girar, llevar y soltar'], ['3 nov', 'Sergio Bot v2: bot propio que lee la página'], ['2 nov', 'renovación de los artículos antiguos terminada'], ['31 oct', 'calculadora «¿Cuánto necesito?» y simuladores de IC2']].map(l => '<div><span class="c-num">' + l[0] + '</span>  ' + l[1] + '</div>').join('');
  if (id === 'leeme') { const pre = document.createElement('pre'); pre.textContent = LEEME.join('\n'); body.appendChild(pre); }
  W.querySelector('.win-bar button').onclick = () => W.remove();
  W.addEventListener('pointerdown', () => { W.style.zIndex = ++zTop; });
  arrastraVentana(W, W.querySelector('.win-bar'));
  $('#wins').appendChild(W);
  if (id === 'terminal') { const inp = W.querySelector('input'); if (inp) inp.focus({ preventScroll: true }); }
}
function arrastraVentana(W, bar) {
  let sx, sy, ox, oy, on = false;
  bar.addEventListener('pointerdown', e => { if (e.target.tagName === 'BUTTON') return; on = true; sx = e.clientX; sy = e.clientY; ox = W.offsetLeft; oy = W.offsetTop; bar.setPointerCapture(e.pointerId); });
  bar.addEventListener('pointermove', e => { if (!on) return; W.style.left = clamp(ox + e.clientX - sx, -200, innerWidth - 120) + 'px'; W.style.top = clamp(oy + e.clientY - sy, 44, innerHeight - 80) + 'px'; });
  bar.addEventListener('pointerup', () => { on = false; });
}
function terminal(body) {
  const out = document.createElement('div'); body.appendChild(out);
  const linea = (t, cls) => { const d = document.createElement('div'); d.className = 'term-line ' + (cls || ''); d.textContent = t; out.appendChild(d); body.scrollTop = body.scrollHeight; };
  linea('SergioLearns OS v0.2 · terminal'); linea('Escribe help. Hay una misión activa: escribe misiones.', 'c-dim');
  const row = document.createElement('div'); row.className = 'term-in';
  row.innerHTML = '<label for="t-in">sergio@learns:~<span class="dollar">$</span></label><input id="t-in" autocomplete="off" spellcheck="false">';
  body.appendChild(row);
  const inp = row.querySelector('input');
  inp.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return; e.preventDefault();
    const c = inp.value.trim(); inp.value = ''; if (!c) return; linea('$ ' + c, 'c-cmd');
    if (c === 'help') linea('órdenes: ls, ls -a, cat <archivo>, misiones, clear, shutdown');
    else if (c === 'ls') linea('LEEME.txt   apuntes/   misiones/   simuladores/   novedades.log');
    else if (/^ls -(a|la|al)$/.test(c)) linea('.   ..   .pista   LEEME.txt   apuntes/   misiones/   simuladores/   novedades.log');
    else if (c === 'misiones') { linea('Misión 1 · El archivo escondido'); linea('Hay un archivo que ls no enseña. Encuéntralo y léelo con cat.'); linea('pista: los archivos ocultos empiezan por un punto', 'c-dim'); }
    else if (c === 'cat .pista') { linea('[ OK ] Misión 1 completada: ls -a enseña los archivos ocultos.', 'c-ok'); linea('En la v0.3, los logros y misiones nuevas.', 'c-dim'); }
    else if (c === 'cat LEEME.txt') LEEME.forEach(l => linea(l));
    else if (c === 'cat novedades.log') { linea('4 nov  escritorio v0.2'); linea('3 nov  Sergio Bot v2'); }
    else if (c.startsWith('cat ')) linea('cat: ' + c.slice(4) + ': no existe o es un directorio', 'c-err');
    else if (c === 'clear') out.innerHTML = '';
    else if (c === 'shutdown' || c === 'exit' || c === 'poweroff') apaga();
    else linea(c.split(' ')[0] + ': orden no encontrada. Prueba help', 'c-err');
  });
}
let fondoRAF = null;
function arrancaFondo() {
  const cv = $('#wall'), g = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);
  const size = () => { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }; size(); addEventListener('resize', size);
  const dots = []; for (let i = 0; i < 70; i++) dots.push({ x: Math.random(), y: Math.random(), s: 0.2 + Math.random() * 0.8, c: Math.random() < 0.15 ? '#FF6B4A' : '#A99EF5' });
  const frame = t => {
    const w = cv.width, h = cv.height; g.fillStyle = '#141221'; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(169,158,245,.06)'; g.lineWidth = dpr; const step = 36 * dpr, off = reduced ? 0 : (t / 60) % step;
    g.beginPath(); for (let x = -step + off; x < w; x += step) { g.moveTo(x, 0); g.lineTo(x, h); } for (let y = -step + off; y < h; y += step) { g.moveTo(0, y); g.lineTo(w, y); } g.stroke();
    dots.forEach(d => { const yy = ((d.y + (reduced ? 0 : t / 90000 * d.s)) % 1) * h; g.fillStyle = d.c; g.globalAlpha = 0.25 + d.s * 0.35; g.beginPath(); g.arc(d.x * w, yy, 1.6 * dpr + d.s * dpr, 0, Math.PI * 2); g.fill(); });
    g.globalAlpha = 1; g.fillStyle = 'rgba(232,230,245,.07)'; g.font = '600 ' + Math.round(64 * dpr) + 'px ' + DISP; g.textAlign = 'center'; g.fillText('~/sergiolearns', w / 2, h / 2);
    fondoRAF = requestAnimationFrame(frame);
  };
  fondoRAF = requestAnimationFrame(frame);
}
function paraFondo() { if (fondoRAF) cancelAnimationFrame(fondoRAF); fondoRAF = null; }
function reloj() { const d = new Date(); $('#clock').textContent = 'sergio@learns · ' + d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); }
setInterval(reloj, 15000); reloj();
function abreOS() {
  const os = $('#os'); os.hidden = false; os.classList.remove('off'); os.classList.add('on'); cambia('os'); arrancaFondo();
  $('#wins').innerHTML = ''; abreVentana('terminal'); abreVentana('leeme');
}

/* ===================== 11 · teclado y accesibilidad =====================
   E20: sin botones a la vista, pero todo se puede hacer con el teclado.
   Tab recorre los objetos (la cámara los mira, brillan y se dice su nombre),
   Intro los coge, E los usa y Esc vuelve. El primer Tab enseña el enlace a la
   web normal. Los lectores de pantalla oyen cada paso (región aria-live). */
const ORDEN = ['manual', ...LIBROS.map(b => 'libro-' + b.id), 'pizarra', 'lampara', 'monitor', 'teclado', 'encendido', 'cajon', ...CARPETAS.map(f => 'carpeta-' + f.id),
  'estuche', ...SIMULACROS.map(s => 'disco-' + s.id), 'expulsar', ...SIMULADORES.map(s => 'usb-' + s.id), 'taza', 'puerta', 'salida'];
const nav = $('#objetos'), etiqueta = $('#etiqueta');
let enfocado = null;
ORDEN.forEach(clave => {
  const o = objetos.get(clave); if (!o) return;
  const b = document.createElement('button'); b.type = 'button'; b.textContent = o.nombre; b.dataset.clave = clave;
  b.addEventListener('focus', () => {
    teclado.activo = true; enfocado = clave; punto.el.classList.add('oculto');
    if (gesto.estado === 'libre') {
      if (gesto.hover) setHover(null);
      brillo(o.mallas, 1.6);
      enfoca(centroDe(o), BASE, 56, { paralaje: 0, rate: 4 });
    }
    const ok = o.activo();
    anuncia(o.nombre + (ok ? '. Intro para ' + (o.movil || o.tipo === 'libro' ? 'cogerlo' : 'usarlo') + '.' : (clave.startsWith('carpeta') ? '. Abre antes el cajón.' : clave === 'salida' ? '. Abre antes la puerta.' : '.')));
  });
  b.addEventListener('blur', () => {
    brillo(o.mallas, 0); if (enfocado === clave) enfocado = null;
    setTimeout(() => { if (!enfocado && gesto.estado === 'libre' && rig.foco && rig.foco.rate === 4) sueltaFoco(); }, 0);
  });
  b.addEventListener('click', e => {
    if (gesto.estado !== 'libre' || !o.activo()) return;
    brillo(o.mallas, 0); clicEn(o, null, e);
  });
  nav.appendChild(b);
});
// al salir de un modo que escribe (taza, teclado), el foco vuelve a su objeto en la lista (si se usaba el teclado) o al lienzo,
// para que el siguiente Tab siga por los objetos y no salte al enlace del principio
function devuelveFoco(clave) {
  const b = teclado.activo && nav.querySelector('[data-clave="' + clave + '"]');
  if (b) b.focus({ preventScroll: true }); else canvas.focus({ preventScroll: true });
}
function centroDe(o) { const caja = new THREE.Box3(); o.mallas.forEach(m => caja.expandByObject(m)); return caja.getCenter(new THREE.Vector3()); }
function aPantalla(p) { const v = p.clone().project(camera); return [(v.x + 1) / 2, (1 - v.y) / 2, v.z]; }
function corrEtiqueta() {
  if (!teclado.activo || !enfocado || gesto.estado !== 'libre') { etiqueta.hidden = true; return; }
  const o = objetos.get(enfocado), [x, y, z] = aPantalla(centroDe(o));
  if (z > 1) { etiqueta.hidden = true; return; }
  etiqueta.textContent = o.nombre; etiqueta.hidden = false;
  etiqueta.style.left = (x * innerWidth) + 'px'; etiqueta.style.top = (y * innerHeight) + 'px';
}

/* ---------- teclas ---------- */
addEventListener('keydown', e => {
  if (gesto.estado === 'cargando') return;
  const enNav = e.target && e.target.dataset && e.target.dataset.clave;
  if (e.key === 'Escape') {
    e.preventDefault();
    const m = modos[gesto.estado];
    if (m && m.esc) return m.esc();
    if (gesto.estado === 'libre') {
      if (puertaAbierta) return puerta(false);
      if (cajonM.obj > 0.15) return cierraCajon();
      if (rig.foco) sueltaFoco();
      rumboACero(); if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    }
    return;
  }
  if (gesto.estado === 'os') return;                              // dentro del PC, el teclado es del sistema
  if ((gesto.estado === 'bot' || gesto.estado === 'escribir')) return;
  if (enNav && (e.key === 'Enter' || e.key === ' ') && gesto.estado === 'libre') return;   // lo hace el botón
  const m = modos[gesto.estado];
  if (m && m.tecla && m.tecla(e)) { e.preventDefault(); return; }
  if (gesto.estado === 'libre') {
    const k = e.key.toLowerCase();
    if (k === 'a' || e.key === 'ArrowLeft') { rig.teclaGiro = -1; e.preventDefault(); }
    if (k === 'd' || e.key === 'ArrowRight') { rig.teclaGiro = 1; e.preventDefault(); }
  }
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'a' || k === 'd' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') rig.teclaGiro = 0;
});

/* ===================== 12 · bucle y arranque =====================
   Un fotograma: animaciones → muelles → cámara → lo que está en la mano →
   partículas → qué hay bajo el puntero → dibujar. */
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let ultimo = performance.now(), diaPizarra = new Date().getDate();
const luzMano = new THREE.PointLight(0xFFF1DE, 0, 0, 2); scene.add(luzMano);
function bucle(ahora) {
  const dt = Math.min(0.05, (ahora - ultimo) / 1000); ultimo = ahora;
  corrAnims(ahora);
  drawer.position.z = cajonM.paso(dt);
  updateKeys(ahora);
  aplicaCamara(dt);
  corrInspeccion(dt); corrLlevar(dt); corrPizarra(dt);
  corrVapor(ahora); corrPolvo(ahora, lamparaOn); corrBot(ahora); corrEstuche(ahora);
  if (ratonVisto && gesto.estado === 'libre' && !teclado.activo && !gesto.pulsado && !gesto.arrastre) { const r = pick(); setHover(r ? r.o.clave : null); }
  else if (gesto.estado !== 'libre' && gesto.hover) setHover(null);
  corrEtiqueta();
  // luz de la mano: ilumina lo que tienes delante (libro, carpeta, objeto inspeccionado) con luz blanca cálida
  const cerca = ['inspeccion', 'lectura', 'carpeta', 'bot'].includes(gesto.estado) || (gesto.estado === 'ocupado' && gesto.obj);
  luzMano.intensity = lerp(luzMano.intensity, cerca ? 0.5 : 0, reduced ? 1 : 1 - Math.exp(-dt * 6));
  luzMano.position.copy(camera.position).add(v3(0.08, 0.12, 0).applyQuaternion(camera.quaternion));
  if (ahora - pantalla.ult > 40) { pantalla.ult = ahora; dibujaPantalla(ahora); }
  const leyendo = ahora < ledHasta;
  led.material.emissiveIntensity = reduced ? 1 : (leyendo ? (Math.sin(ahora / 60) > 0 ? 1.8 : 0.1) : 1.0 + Math.sin(ahora / 900) * 0.3);
  screenLight.intensity = $('#os').hidden ? (pantalla.estado === 'reposo' ? 1.2 : 2.0) : 0;
  if (new Date().getDate() !== diaPizarra) { diaPizarra = new Date().getDate(); dibujaBase(); componePizarra(); }
  if ($('#os').hidden) renderer.render(scene, camera);
  fps.cuenta++;
  requestAnimationFrame(bucle);
}
const fps = { cuenta: 0 };

/* ---------- para los guiones de grabar.js y las pruebas ---------- */
// __slPantalla(clave) → [x, y] de 0 a 1: dónde cae el centro del objeto en la pantalla
window.__slPantalla = clave => {
  let p = null;
  if (clave === 'disquetera') p = tray.getWorldPosition(new THREE.Vector3()).add(v3(0, 0, 0.05));
  else if (clave === 'puerto-usb') p = PUERTO.clone();
  else if (clave === 'pizarra-v' || clave === 'pizarra-f') { const [x, y, w, h] = clave === 'pizarra-v' ? CAJA_V : CAJA_F; p = enPizarra(x + w / 2, y + h / 2); }
  else if (clave === 'pagina-derecha' && lectura.rig) p = lectura.rig.pagDer.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(lectura.rig.W * 0.3, 0, 0).applyQuaternion(lectura.rig.rig.quaternion));
  else if (clave === 'pagina-izquierda' && lectura.rig) p = lectura.rig.pagIzq.getWorldPosition(new THREE.Vector3());
  else if (clave === 'mesa') p = v3(0.02, PLANO_Y, -0.08);
  else if (clave.endsWith('-etiqueta') && objetos.get(clave.replace('-etiqueta', ''))) p = objetos.get(clave.replace('-etiqueta', '')).raiz.localToWorld(v3(0, 0.005, 0.088));
  else if (objetos.get(clave)) p = centroDe(objetos.get(clave));
  if (!p) return [0.5, 0.5];
  camera.updateMatrixWorld(); const [x, y] = aPantalla(p);
  return [clamp(x, 0, 1), clamp(y, 0, 1)];
};
window.__slEstado = () => gesto.estado;
window.__slHover = () => gesto.hover;
window.__slObj = k => objetos.get(k);
window.__slPos = clave => { const o = objetos.get(clave); if (!o || !o.raiz) return null; const p = o.raiz.getWorldPosition(new THREE.Vector3()); return [+p.x.toFixed(3), +p.y.toFixed(3), +p.z.toFixed(3), o.raiz.visible]; };
window.__slRumbo = r => { rig.rumbo = r; cam.yaw = r; };
window.__slFps = () => fps.cuenta;
window.__slVersion = VERSION;
window.__slInfo = () => ({ llamadas: renderer.info.render.calls, triangulos: renderer.info.render.triangles, geometrias: renderer.info.memory.geometries, texturas: renderer.info.memory.textures, objetos: objetos.size });

/* ---------- arranque: espera a las fuentes y redibuja los lienzos con ellas ---------- */
const fuentes = document.fonts && document.fonts.load ? Promise.all(['600 40px "Space Grotesk"', '400 20px "JetBrains Mono"', '600 20px "JetBrains Mono"', '400 20px Inter', '700 40px Caveat', '500 30px Caveat'].map(f => document.fonts.load(f))) : Promise.resolve();
Promise.race([fuentes, new Promise(r => setTimeout(r, 2500))]).then(() => {
  TEXTURAS.forEach(t => redibuja(t));
  dibujaBase(); componePizarra();
  cambia('libre');
  requestAnimationFrame(bucle);
  setTimeout(() => { $('#carga').classList.add('fuera'); setTimeout(() => { $('#carga').hidden = true; }, 650); }, 200);
});

</script>
